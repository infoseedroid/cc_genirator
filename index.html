<!DOCTYPE html>

<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iftaa Systems Access Card</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
    box-sizing:border-box;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
}

body{
    margin:0;
    background:#eef3f1;
    color:#222;
}

body.rtl{
    direction:rtl;
}

body.rtl .info-row,
body.rtl .security-notice{
    text-align:right;
}

/* LANGUAGE BUTTON */

.language-switcher{
    position:absolute;
    top:18px;
    right:20px;
    z-index:10;
}

body.rtl .language-switcher{
    right:auto;
    left:20px;
}

.language-btn{
    border:none;
    background:white;
    color:#0b6b4a;
    padding:9px 15px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.language-btn:hover{
    background:#f2f7f4;
}

/* SPLASH */

#splashScreen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#ffffff;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:99999;
    opacity:1;
    visibility:visible;
    transition:opacity .6s ease, visibility .6s ease;
}

#splashScreen.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.splash-content{
    text-align:center;
    padding:25px;
}

.splash-logo{
    width:150px;
    height:150px;
    object-fit:contain;
    margin-bottom:20px;
    animation:pulse 2s infinite;
}

.splash-content h1{
    color:#0b6b4a;
    font-size:26px;
    margin:10px;
}

.splash-content p{
    color:#555;
    font-size:16px;
}

.spinner{
    width:50px;
    height:50px;
    border-radius:50%;
    border:5px solid #ddd;
    border-top-color:#0b6b4a;
    margin:25px auto;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

@keyframes pulse{
    50%{
        transform:scale(1.08);
    }
}

/* HEADER */

.header{
    position:relative;
    background:#0b6b4a;
    color:white;
    text-align:center;
    padding:25px;
}

.header img{
    width:90px;
    height:90px;
    border-radius:50%;
    background:white;
    padding:5px;
    object-fit:contain;
}

.header h1{
    margin:15px 0 5px;
    font-size:28px;
}

.header p{
    margin:0;
    font-size:15px;
}

/* CONTAINER */

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.box{
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.section-title{
    text-align:center;
    color:#0b6b4a;
    font-size:22px;
    margin-bottom:20px;
}

/* FORM */

.form-group{
    margin-top:18px;
}

.form-group label{
    display:block;
    font-weight:600;
    margin-bottom:8px;
    color:#333;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:15px;
    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#0b6b4a;
    box-shadow:0 0 5px rgba(11,107,74,.3);
}

textarea{
    height:90px;
    resize:none;
}

select{
    background:white;
    cursor:pointer;
}

/* BUTTONS */

.create-btn,
.search-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    margin-top:20px;
    font-size:16px;
    cursor:pointer;
}

.create-btn{
    background:#0b6b4a;
    color:white;
}

.search-btn{
    background:#555;
    color:white;
}

.create-btn:hover{
    background:#095a3e;
}

.search-btn:hover{
    background:#444;
}

/* GENERATED CARD AREA */

.generated-card-area{
    display:none;
    margin-top:35px;
    padding-top:30px;
    border-top:2px solid #e5ebe8;
}

.generated-card-area.show{
    display:block;
}

/* GENERATED CARD */

.generated-card{
    width:100%;
    max-width:650px;
    margin:0 auto;
    background:#ffffff;
    border-radius:16px;
    padding:20px;
    box-shadow:0 5px 18px rgba(0,0,0,.15);
    border:1px solid #e1e8e5;
    text-align:center;
}

/* CARD LOGO */

.card-logo{
    width:100%;
    height:90px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:12px;
    overflow:hidden;
}

.card-logo img{
    width:auto;
    height:100%;
    max-width:80%;
    object-fit:contain;
    display:block;
}

/* CARD TITLE */

.generated-card h2{
    color:#0b6b4a;
    margin:8px 0 18px;
    font-size:21px;
}

/* QR */

.qr-area{
    display:flex;
    justify-content:center;
    align-items:center;
    margin:10px 0 18px;
}

#qrCode{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* INFORMATION */

.info-row{
    text-align:left;
    background:#f6f8f7;
    border-radius:9px;
    padding:9px 12px;
    margin-top:8px;
    line-height:1.45;
    word-break:break-word;
    font-size:13px;
}

.info-row b{
    color:#0b6b4a;
}

/* STATUS */

.access-status{
    margin-top:10px;
    padding:8px 12px;
    border-radius:9px;
    background:#eaf6ef;
    color:#0b6b4a;
    font-size:13px;
    font-weight:700;
    text-align:center;
}

/* SECURITY */

.security-notice{
    margin-top:12px;
    padding:11px;
    background:#fff8e6;
    border:1px solid #ead9a6;
    border-radius:10px;
    text-align:left;
}

.security-notice-title{
    font-weight:700;
    color:#8a6500;
    font-size:13px;
    margin-bottom:6px;
}

.security-notice p{
    margin:0;
    color:#6b5500;
    font-size:11px;
    line-height:1.5;
}

/* FOOTER */

.card-footer{
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid #ddd;
    color:#666;
    font-size:11px;
}

/* CARD ACTIONS */

.card-actions{
    position:relative;
    width:100%;
    max-width:650px;
    margin:15px auto 0;
    text-align:center;
}

.more-btn{
    border:none;
    background:#555;
    color:white;
    padding:10px 22px;
    border-radius:10px;
    font-size:15px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.more-btn:hover{
    background:#444;
}

.more-dots{
    font-size:22px;
    font-weight:bold;
    line-height:15px;
}

/* MODAL */

.card-modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.55);
    z-index:999999;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card-modal.show{
    display:flex;
}

.card-modal-box{
    width:100%;
    max-width:390px;
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 15px 45px rgba(0,0,0,.30);
}

.card-modal-header{
    text-align:center;
    margin-bottom:20px;
}

.card-modal-header h3{
    margin:0;
    color:#0b6b4a;
    font-size:21px;
}

.card-modal-header p{
    margin:7px 0 0;
    color:#777;
    font-size:13px;
}

.card-modal-option{
    width:100%;
    border:none;
    background:#f6f8f7;
    border-radius:12px;
    padding:14px;
    margin-top:10px;
    display:flex;
    align-items:center;
    gap:14px;
    font-size:15px;
    text-align:left;
    cursor:pointer;
}

body.rtl .card-modal-option{
    text-align:right;
}

.card-modal-icon{
    width:44px;
    height:44px;
    border-radius:11px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
    flex-shrink:0;
}

.card-modal-text{
    flex:1;
}

.card-modal-text strong{
    display:block;
    color:#222;
    font-size:15px;
}

.card-modal-text small{
    display:block;
    color:#777;
    margin-top:3px;
    font-size:12px;
}

.card-modal-close{
    width:100%;
    border:none;
    background:transparent;
    color:#666;
    padding:12px;
    margin-top:10px;
    font-size:14px;
    cursor:pointer;
}

/* SEARCH / ARCHIVE */

.search-panel{
    display:none;
    margin-top:30px;
    padding-top:25px;
    border-top:2px solid #e5ebe8;
}

.search-panel.show{
    display:block;
}

.archive-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.archive-count{
    background:#eaf6ef;
    color:#0b6b4a;
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
}

.archive-actions{
    display:flex;
    gap:8px;
}

.archive-small-btn{
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    background:#555;
    color:white;
    font-size:12px;
}

.archive-small-btn.delete-all{
    background:#b42318;
}

.search-input-row{
    display:flex;
    gap:10px;
}

.search-input-row input{
    flex:1;
}

.search-input-row button{
    border:none;
    border-radius:10px;
    padding:0 20px;
    background:#0b6b4a;
    color:white;
    cursor:pointer;
}

.search-results{
    margin-top:20px;
}

.search-result{
    background:#f6f8f7;
    border:1px solid #e0e7e3;
    border-radius:12px;
    padding:14px;
    margin-top:10px;
}

.search-result-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.search-result-title{
    font-weight:700;
    color:#0b6b4a;
}

.search-result-id{
    font-size:11px;
    color:#777;
}

.search-result-info{
    margin-top:8px;
    font-size:13px;
    line-height:1.6;
}

.search-result-buttons{
    display:flex;
    gap:8px;
    margin-top:12px;
    flex-wrap:wrap;
}

.result-btn{
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
}

.result-btn.view{
    background:#0b6b4a;
    color:white;
}

.result-btn.delete{
    background:#b42318;
    color:white;
}

.result-btn.edit{
    background:#8a6500;
    color:white;
}

.no-results{
    text-align:center;
    padding:20px;
    color:#777;
    background:#f8f8f8;
    border-radius:10px;
}

/* TOAST */

#successToast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%) translateY(30px);
    background:#0b6b4a;
    color:white;
    padding:14px 22px;
    border-radius:12px;
    font-size:14px;
    font-weight:500;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
    opacity:0;
    visibility:hidden;
    transition:opacity .3s ease, transform .3s ease, visibility .3s ease;
    z-index:1000000;
    text-align:center;
    min-width:260px;
    max-width:90%;
}

#successToast.show{
    opacity:1;
    visibility:visible;
    transform:translateX(-50%) translateY(0);
}

/* MOBILE */

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .box{
        padding:18px;
        border-radius:15px;
    }

    .header{
        padding:20px 15px;
    }

    .header img{
        width:75px;
        height:75px;
    }

    .header h1{
        font-size:22px;
    }

    .header p{
        font-size:13px;
    }

    .section-title{
        font-size:20px;
    }

    .generated-card{
        padding:15px;
        border-radius:14px;
    }

    .card-logo{
        height:80px;
    }

    .generated-card h2{
        font-size:19px;
    }

    .info-row{
        font-size:12px;
    }

    .security-notice{
        padding:9px;
    }

    .security-notice-title{
        font-size:12px;
    }

    .security-notice p{
        font-size:10px;
    }

    .card-footer{
        font-size:10px;
    }

    .search-input-row{
        flex-direction:column;
    }

    .search-input-row button{
        padding:13px;
    }

    .search-result-header{
        flex-direction:column;
        align-items:flex-start;
    }

    .language-switcher{
        top:12px;
        right:12px;
    }

    body.rtl .language-switcher{
        left:12px;
        right:auto;
    }

}

/* PRINT */

@media print{

    body *{
        visibility:hidden;
    }

    .generated-card,
    .generated-card *{
        visibility:visible;
    }

    .generated-card{
        position:absolute;
        left:0;
        top:0;
    }

}

</style>

</head>

/* =====================================================
   TRANSLATION HELPER
===================================================== */

function t(key){

    return translations[currentLanguage][key] ||
           translations.en[key] ||
           key;

}

/* =====================================================
   APPLY LANGUAGE
===================================================== */

function applyLanguage(){

    document.documentElement.lang =
        currentLanguage;

    document.documentElement.dir =
        currentLanguage === "ar"
        ? "rtl"
        : "ltr";

    document.body.classList.toggle(
        "rtl",
        currentLanguage === "ar"
    );

    const ids = [

        "splashTitle",
        "splashLoading",
        "mainTitle",
        "mainSubtitle",
        "languageButton",
        "createTitle",
        "employeeNumberLabel",
        "employeeNameLabel",
        "locationLabel",
        "systemNameLabel",
        "environmentLabel",
        "accessLevelLabel",
        "systemUrlLabel",
        "notesLabel",
        "createButton",
        "searchButton",
        "moreButtonText",
        "modalTitle",
        "modalSubtitle",
        "saveImageTitle",
        "saveImageDescription",
        "savePDFTitle",
        "savePDFDescription",
        "cancelButton",
        "refreshButton",
        "deleteAllButton",
        "searchEmployeeLabel",
        "searchNowButton",
        "showAllButton"

    ];

    ids.forEach(function(id){

        const element =
            document.getElementById(id);

        if(element){

            element.textContent =
                t(id);

        }

    });

    const placeholders = {

        employeeNumber:
            "employeeNumberPlaceholder",

        employeeName:
            "employeeNamePlaceholder",

        location:
            "locationPlaceholder",

        systemName:
            "systemNamePlaceholder",

        systemUrl:
            "systemUrlPlaceholder",

        notes:
            "notesPlaceholder",

        searchEmployeeNumber:
            "searchEmployeePlaceholder"

    };

    Object.keys(placeholders)
    .forEach(function(id){

        const element =
            document.getElementById(id);

        if(element){

            element.placeholder =
                t(placeholders[id]);

        }

    });

    document.getElementById(
        "environmentPlaceholder"
    ).textContent =
        t("environmentPlaceholder");

    document.getElementById(
        "environmentOS"
    ).textContent =
        t("environmentOS");

    document.getElementById(
        "environmentDesktop"
    ).textContent =
        t("environmentDesktop");

    document.getElementById(
        "environmentWeb"
    ).textContent =
        t("environmentWeb");

    document.getElementById(
        "accessPlaceholder"
    ).textContent =
        t("accessPlaceholder");

    document.getElementById(
        "accessView"
    ).textContent =
        t("accessView");

    document.getElementById(
        "accessStandard"
    ).textContent =
        t("accessStandard");

    document.getElementById(
        "accessAdvanced"
    ).textContent =
        t("accessAdvanced");

    document.getElementById(
        "accessAdmin"
    ).textContent =
        t("accessAdmin");

    updateArchiveCount();

    if(editingCardID){
        document.getElementById("createButton").textContent = t("updateButton");
    }

    /*
       If a card is currently displayed,
       re-render it using the new language.
       Stored data itself is NOT changed.
    */

    if(currentCardData){

        renderCard(
            currentCardData
        );

    }

}

/* =====================================================
   TOGGLE LANGUAGE
===================================================== */

function toggleLanguage(){

    currentLanguage =
        currentLanguage === "en"
        ? "ar"
        : "en";

    localStorage.setItem(
        LANGUAGE_KEY,
        currentLanguage
    );

    applyLanguage();

    if(
        document.getElementById("searchPanel")
        .classList.contains("show")
    ){
        refreshVisibleResults();
    }

}

/* =====================================================
   SPLASH
===================================================== */

window.addEventListener(
    "load",
    function(){

        applyLanguage();

        refreshArchive();

        const splash =
            document.getElementById(
                "splashScreen"
            );

        /*
           Splash is intentionally limited to
           five seconds. External libraries cannot
           keep it alive.
        */

        setTimeout(
            function(){

                splash.classList.add(
                    "hide"
                );

            },
            5000
        );

    }
);

/*
   Emergency fallback:
   even if a browser behaves unexpectedly,
   never leave the splash permanently visible.
*/

setTimeout(
    function(){

        const splash =
            document.getElementById(
                "splashScreen"
            );

        if(splash){

            splash.classList.add(
                "hide"
            );

        }

    },
    8000
);

/* =====================================================
   ENVIRONMENT
===================================================== */

function changeEnvironment(){

    const selected =
        document.getElementById(
            "environment"
        );

    selectedEnvironment =
        selected.value;

    const urlSection =
        document.getElementById(
            "urlSection"
        );

    if(
        selectedEnvironment === "Web"
    ){

        urlSection.style.display =
            "block";

    }
    else{

        urlSection.style.display =
            "none";

        document.getElementById(
            "systemUrl"
        ).value = "";

    }

}

/* =====================================================
   GET STORED CARDS
===================================================== */

function getStoredCards(){

    try{

        const data =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(!data){

            return [];

        }

        const cards =
            JSON.parse(data);

        return Array.isArray(cards)
            ? cards
            : [];

    }
    catch(error){

        console.error(
            "Storage read error:",
            error
        );

        return [];

    }

}

/* =====================================================
   SAVE STORED CARDS
===================================================== */

function saveStoredCards(cards){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(cards)
        );

        return true;

    }
    catch(error){

        console.error(
            "Storage save error:",
            error
        );

        return false;

    }

}

/* =====================================================
   UPDATE COUNT
===================================================== */

function updateArchiveCount(){

    const count =
        getStoredCards().length;

    const text =
        count + " " +
        (
            count === 1
            ? t("card")
            : t("cards")
        );

    document.getElementById(
        "archiveCount"
    ).textContent =
        t("savedCards") +
        ": " +
        text;

}

/* =====================================================
   GENERATE CARD
===================================================== */

function generateCard(){

    const employeeNumber =
        document
        .getElementById(
            "employeeNumber"
        )
        .value
        .trim();

    const employee =
        document
        .getElementById(
            "employeeName"
        )
        .value
        .trim();

    const location =
        document
        .getElementById(
            "location"
        )
        .value
        .trim();

    const system =
        document
        .getElementById(
            "systemName"
        )
        .value
        .trim();

    const environment =
        document
        .getElementById(
            "environment"
        )
        .value;

    const accessLevel =
        document
        .getElementById(
            "accessLevel"
        )
        .value;

    const url =
        document
        .getElementById(
            "systemUrl"
        )
        .value
        .trim();

    const notes =
        document
        .getElementById(
            "notes"
        )
        .value
        .trim();

    /* REQUIRED FIELDS */

    if(
        employeeNumber === "" ||
        employee === "" ||
        system === "" ||
        environment === "" ||
        accessLevel === ""
    ){

        alert(
            t("requiredFields")
        );

        return;

    }

    /* URL REQUIRED FOR WEB */

    if(
        environment === "Web" &&
        url === ""
    ){

        alert(
            t("urlRequired")
        );

        return;

    }

    /* CREATE UNIQUE CARD ID */

    const cardID =
        "IFT-" +
        new Date().getFullYear() +
        "-" +
        Math.floor(
            Math.random() * 90000 + 10000
        );

    /*
       IMPORTANT:
       Store the date in a language-neutral
       format so changing interface language
       does not alter the underlying card data.
    */

    const createdISO =
        new Date().toISOString();

    const currentDate =
        new Date();

    const created =
        currentDate.toLocaleDateString(
            currentLanguage === "ar"
            ? "ar-JO"
            : "en-US"
        );

    /*
       This object is NOT saved yet.
       It is only prepared for confirmation.
    */

    currentCardData = {

        cardID:
            cardID,

        employeeNumber:
            employeeNumber,

        employee:
            employee,

        system:
            system,

        environment:
            environment,

        accessLevel:
            accessLevel,

        url:
            url,

        notes:
            notes,

        created:
            created,

        createdISO:
            createdISO

    };

    /* SHOW PREVIEW */

    renderCard(
        currentCardData
    );

    document
    .getElementById(
        "generatedCardArea"
    )
    .classList.add("show");

    setTimeout(
        function(){

            document
            .getElementById(
                "generatedCardArea"
            )
            .scrollIntoView({
                behavior:"smooth",
                block:"start"
            });

        },
        100
    );

    /* SAVE NEW CARD OR UPDATE EXISTING CARD */

    if(editingCardID){

        const shouldSave =
            confirm(t("editQuestion"));

        const cards = getStoredCards();
        const index = cards.findIndex(
            function(card){
                return card.cardID === editingCardID;
            }
        );

        if(index === -1){
            alert(t("noSearchResults"));
            editingCardID = null;
            document.getElementById("createButton").textContent = t("createButton");
            return;
        }

        if(!shouldSave){
            currentCardData = cards[index];
            editingCardID = null;
            document.getElementById("createButton").textContent = t("createButton");
            renderCard(currentCardData);
            clearInputForm();
            showSuccessToast(t("cardNotSaved"));
            return;
        }

        /* Preserve the original creation information. */
        currentCardData.created = cards[index].created;
        currentCardData.createdISO = cards[index].createdISO || currentCardData.createdISO;
        cards[index] = currentCardData;

        const saved = saveStoredCards(cards);
        if(!saved){
            alert("Unable to save card data.");
            return;
        }

        editingCardID = null;
        document.getElementById("createButton").textContent = t("createButton");
        updateArchiveCount();
        showSuccessToast(t("cardUpdated"));
        clearInputForm();
        refreshVisibleResults();
        return;
    }

    const shouldSave =
        confirm(t("saveQuestion"));

    if(!shouldSave){
        showSuccessToast(t("cardNotSaved"));
        return;
    }

    const cards = getStoredCards();
    cards.unshift(currentCardData);

    const saved = saveStoredCards(cards);
    if(!saved){
        alert("Unable to save card data.");
        return;
    }

    updateArchiveCount();
    showSuccessToast(t("cardSaved"));
    clearInputForm();

}

===================================================== */

            translateEnvironment(
                data.environment
            )
        );

    const accessLevel =
        escapeHTML(
            translateAccessLevel(
                data.accessLevel
            )
        );

        escapeHTML(
            data.url || ""

        escapeHTML(
            data.notes || ""

       Existing stored cards may have created,
       while newer cards also have createdISO.
    */

        data.created || "";

    /*
       If createdISO exists, always display it
       according to the CURRENT interface language.
       This is what makes language switching
       independent from stored card data.
    */

    if(data.createdISO){

        try{

            createdDisplay =
                new Date(
                    data.createdISO
                ).toLocaleDateString(
                    currentLanguage === "ar"
                    ? "ar-JO"
                    : "en-US"
                );

        }
        catch(error){

            createdDisplay =
                data.created || "";

        }

    }

    const created =
        escapeHTML(
            createdDisplay
        );

    document.getElementById(
        "generatedCard"
    ).innerHTML = `

    <div class="generated-card">

        <div class="card-logo">

            <img
                src="card-logo.png"
                alt="Card Logo"
                onerror="this.style.display='none'"
            >

        </div>

        <h2>
            ${t("accessCard")}
        </h2>

        ${
            data.environment === "Web"
            ?
            `
            <div class="qr-area">
                <div id="qrCode"></div>
            </div>
            `
            :
            ""
        }

        <div class="info-row">

            <b>
                ${t("employeeNumber")}
            </b>

            <br>

            ${employeeNumber}

        </div>

        <div class="info-row">

            <b>
                ${t("employee")}
            </b>

            <br>

            ${employee}

        </div>

        <div class="info-row">

            <b>
                ${t("location")}
            </b>

            <br>

            ${location}

        </div>

        <div class="info-row">

            <b>
                ${t("system")}
            </b>

            <br>

            ${system}

        </div>

        <div class="info-row">

            <b>
                ${t("environment")}
            </b>

            <br>

            ${environment}

        </div>

        <div class="info-row">

            <b>
                ${t("accessLevel")}
            </b>

            <br>

            ${accessLevel}

        </div>

        ${
            data.environment === "Web"
            ?
            `
            <div class="info-row">

                <b>
                    ${t("systemURL")}
                </b>

                <br>

                ${url}

            </div>
            `
            :
            ""
        }

        ${
            data.notes
            ?
            `
            <div class="info-row">

                <b>
                    ${t("notes")}
                </b>

                <br>

                ${notes}

            </div>
            `
            :
            ""
        }

        <div class="access-status">

            ${t("authorized")}

        </div>

        <div class="security-notice">

            <div class="security-notice-title">

                ${t("securityTitle")}

            </div>

            <p>

                ${t("securityText")}

            </p>

        </div>

        <div class="card-footer">

            ${t("createdDate")}
            ${created}

            <br>

            ${cardID}

        </div>

    </div>

    `;

    /*
       Generate QR code only for Web applications.
    */

    if(
        data.environment === "Web" &&
        data.url
    ){

        const qrContainer =
            document.getElementById(
                "qrCode"
            );

        if(
            qrContainer &&
            typeof QRCode !== "undefined"
        ){

            new QRCode(
                qrContainer,
                {
                    text:data.url,
                    width:110,
                    height:110
                }
            );

        }

    }

}

/* =====================================================
   TRANSLATE ENVIRONMENT
===================================================== */

function translateEnvironment(value){

    if(
        currentLanguage === "en"
    ){

        return value;

    }

    const map = {

        "Operating System":
            t("environmentOS"),

        "Desktop":
            t("environmentDesktop"),

        "Web":
            t("environmentWeb")

    };

    return map[value] || value;

}

/* =====================================================
   TRANSLATE ACCESS LEVEL
===================================================== */

function translateAccessLevel(value){

    if(
        currentLanguage === "en"
    ){

        return value;

    }

    const map = {

        "View Only":
            t("accessView"),

        "Standard User":
            t("accessStandard"),

        "Advanced User":
            t("accessAdvanced"),

        "Administrator":
            t("accessAdmin")

    };

    return map[value] || value;

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

/* =====================================================
   SEARCH PANEL
===================================================== */

function showSearch(){

    const panel =
        document.getElementById("searchPanel");

    panel.classList.toggle("show");

    if(panel.classList.contains("show")){

        updateArchiveCount();

        /* Search mode starts empty. No cards are displayed automatically. */
        searchMode = "none";
        document.getElementById("searchResults").innerHTML = "";

        setTimeout(function(){
            panel.scrollIntoView({
                behavior:"smooth",
                block:"start"
            });
        },100);
    }

}

/* =====================================================
   REFRESH ARCHIVE
===================================================== */

function refreshArchive(){

    updateArchiveCount();

    /* Refresh does not automatically expose all cards. */
    refreshVisibleResults();

}

function refreshVisibleResults(){

    if(searchMode === "search"){
        searchCards();
        return;
    }

    if(searchMode === "all"){
        renderSearchResults(getStoredCards());
        return;
    }

    document.getElementById("searchResults").innerHTML = "";
}

/* =====================================================
   SEARCH KEY
===================================================== */

function handleSearchKey(event){

    if(
        event.key === "Enter"
    ){

        searchCards();

    }

}

/* =====================================================
   SEARCH CARDS
===================================================== */

function searchCards(){

    const query =
        document.getElementById("searchEmployeeNumber")
        .value.trim().toLowerCase();

    if(query === ""){
        searchMode = "none";
        document.getElementById("searchResults").innerHTML = `
            <div class="no-results">${t("noSearchInput")}</div>
        `;
        return;
    }

    const cards = getStoredCards();

    /*
       Search is intentionally limited to the three requested fields:
       Employee Number, Employee Name and Location.
       It does not search system name, access level, notes, etc.
    */
    const results = cards.filter(function(card){

        const employeeNumber =
            String(card.employeeNumber || "").toLowerCase();

        const employeeName =
            String(card.employee || "").toLowerCase();

        const location =
            String(card.location || "").toLowerCase();

        return employeeNumber.includes(query) ||
               employeeName.includes(query) ||
               location.includes(query);
    });

    searchMode = "search";
    renderSearchResults(results);

} 

/* =====================================================
   SHOW ALL CARDS
===================================================== */

function showAllCards(){

    searchMode = "all";
    document.getElementById("searchEmployeeNumber").value = "";
    renderSearchResults(getStoredCards());

}

/* =====================================================
   RENDER SEARCH RESULTS
===================================================== */

function renderSearchResults(cards){

    const container =
        document.getElementById(
            "searchResults"
        );

    if(!cards.length){

        container.innerHTML = `

            <div class="no-results">

                ${
                    getStoredCards().length === 0
                    ?
                    t("noCards")
                    :
                    t("noSearchResults")
                }

            </div>

        `;

        return;

    }

    container.innerHTML =
        cards.map(
            function(card){

                return `

                <div class="search-result">

                    <div class="search-result-header">

                        <div class="search-result-title">

                            ${escapeHTML(
                                card.employee
                            )}

                        </div>

                        <div class="search-result-id">

                            ${escapeHTML(
                                card.cardID
                            )}

                        </div>

                    </div>

                    <div class="search-result-info">

                        <strong>
                            ${t("employeeNumber")}:
                        </strong>

                        ${escapeHTML(
                            card.employeeNumber
                        )}

                        <br>

                        <strong>
                            ${t("system")}:
                        </strong>

                        ${escapeHTML(
                            card.system
                        )}

                        <br>

                        <strong>
                            ${t("accessLevel")}:
                        </strong>

                        ${escapeHTML(
                            translateAccessLevel(
                                card.accessLevel
                            )
                        )}

                        <br>

                        <strong>
                            ${t("createdDate")}
                        </strong>

                        ${escapeHTML(
                            getCardDisplayDate(
                                card
                            )
                        )}

                    </div>

                    <div class="search-result-buttons">

                        <button
                            class="result-btn view"
                            onclick="viewStoredCard('${escapeJS(card.cardID)}')"
                        >
                            ${t("view")}
                        </button>

                        <button
                            class="result-btn edit"
                            onclick="editStoredCard('${escapeJS(card.cardID)}')"
                        >
                            ${t("edit")}
                        </button>

                        <button
                            class="result-btn delete"
                            onclick="deleteCard('${escapeJS(card.cardID)}')"
                        >
                            ${t("delete")}
                        </button>

                    </div>

                </div>

                `;

            }
        ).join("");

}

/* =====================================================
   CARD DISPLAY DATE
===================================================== */

function getCardDisplayDate(card){

    if(card.createdISO){

        try{

            return new Date(
                card.createdISO
            ).toLocaleDateString(
                currentLanguage === "ar"
                ? "ar-JO"
                : "en-US"
            );

        }
        catch(error){}

    }

    return card.created || "";

}

/* =====================================================
   ESCAPE JAVASCRIPT
===================================================== */

function escapeJS(value){

    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,"&quot;")
        .replace(/\r/g,"")
        .replace(/\n/g,"");

}

/* =====================================================
   VIEW STORED CARD
===================================================== */

function viewStoredCard(cardID){

    const cards =
        getStoredCards();

    const card =
        cards.find(
            function(item){

                return item.cardID === cardID;

            }
        );

    if(!card){

        return;

    }

    renderCard(
        card
    );

    document
    .getElementById(
        "generatedCardArea"
    )
    .classList.add("show");

    setTimeout(
        function(){

            document
            .getElementById(
                "generatedCardArea"
            )
            .scrollIntoView({
                behavior:"smooth",
                block:"start"
            });

        },
        100
    );

}

/* =====================================================
   EDIT STORED CARD
===================================================== */

function editStoredCard(cardID){

    const cards = getStoredCards();
    const card = cards.find(function(item){
        return item.cardID === cardID;
    });

    if(!card){
        return;
    }

    editingCardID = cardID;

    document.getElementById("employeeNumber").value = card.employeeNumber || "";
    document.getElementById("employeeName").value = card.employee || "";
    const locationSelect = document.getElementById("location");
    if(card.location && !Array.from(locationSelect.options).some(o => o.value === card.location)){
        const legacyOption = document.createElement("option");
        legacyOption.value = card.location;
        legacyOption.textContent = card.location;
        locationSelect.appendChild(legacyOption);
    }
    locationSelect.value = card.location || "";
    document.getElementById("systemName").value = card.system || "";
    document.getElementById("environment").value = card.environment || "";
    document.getElementById("accessLevel").value = card.accessLevel || "";
    document.getElementById("systemUrl").value = card.url || "";
    document.getElementById("notes").value = card.notes || "";

    selectedEnvironment = card.environment || "";
    const urlSection = document.getElementById("urlSection");
    urlSection.style.display = card.environment === "Web" ? "block" : "none";

    document.getElementById("createButton").textContent = t("updateButton");

    renderCard(card);
    document.getElementById("generatedCardArea").classList.add("show");

    setTimeout(function(){
        document.getElementById("createTitle").scrollIntoView({
            behavior:"smooth",
            block:"start"
        });
    },100);
}

/* =====================================================
   DELETE CARD
===================================================== */

function deleteCard(cardID){

    if(
        !confirm(
            t("deleteConfirm")
        )
    ){

        return;

    }

    let cards =
        getStoredCards();

    cards =
        cards.filter(
            function(card){

                return card.cardID !== cardID;

            }
        );

    saveStoredCards(
        cards
    );

    updateArchiveCount();

    refreshVisibleResults();

    if(
        currentCardData &&
        currentCardData.cardID === cardID
    ){

        currentCardData = null;
        editingCardID = null;
        document.getElementById("createButton").textContent = t("createButton");

        document
        .getElementById(
            "generatedCard"
        )
        .innerHTML = "";

        document
        .getElementById(
            "generatedCardArea"
        )
        .classList.remove("show");

    }

    showSuccessToast(
        t("cardDeleted")
    );

}

/* =====================================================
   DELETE ALL
===================================================== */

function deleteAllCards(){

    const cards =
        getStoredCards();

    if(!cards.length){

        alert(
            t("noCards")
        );

        return;

    }

    if(
        !confirm(
            t("deleteAllConfirm")
        )
    ){

        return;

    }

    localStorage.removeItem(
        STORAGE_KEY
    );

    currentCardData = null;
    editingCardID = null;
    document.getElementById("createButton").textContent = t("createButton");

    document
    .getElementById(
        "generatedCard"
    )
    .innerHTML = "";

    document
    .getElementById(
        "generatedCardArea"
    )
    .classList.remove("show");

    updateArchiveCount();
    searchMode = "none";
    document.getElementById("searchResults").innerHTML = "";

    showSuccessToast(
        t("allCardsDeleted")
    );

}

/* =====================================================
   MODAL
===================================================== */

function openCardModal(){

    document
    .getElementById(
        "cardModal"
    )
    .classList.add("show");

}

function closeCardModal(){

    document
    .getElementById(
        "cardModal"
    )
    .classList.remove("show");

}

function handleModalBackgroundClick(event){

    if(
        event.target ===
        document.getElementById(
            "cardModal"
        )
    ){

        closeCardModal();

    }

}

/* =====================================================
   TOAST
===================================================== */

function showSuccessToast(message){

    const toast =
        document.getElementById(
            "successToast"
        );

    clearTimeout(
        toastTimer
    );

    toast.innerHTML =
        "✅ " + message;

    toast.classList.add(
        "show"
    );

    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            3500
        );

}

/* =====================================================
   SAVE IMAGE
===================================================== */

async function saveCardAsImage(){

    const card =
        document.querySelector(
            ".generated-card"
        );

    if(!card){

        alert(
            t("createFirst")
        );

        return;

    }

    closeCardModal();

    try{

        if(
            typeof html2canvas === "undefined"
        ){

            throw new Error(
                "html2canvas is not available"
            );

        }

        const canvas =
            await html2canvas(
                card,
                {
                    scale:3,
                    useCORS:true,
                    allowTaint:false,
                    backgroundColor:"#ffffff",
                    imageTimeout:15000
                }
            );

        const link =
            document.createElement(
                "a"
            );

        const cardID =
            currentCardData
            ?
            currentCardData.cardID
            :
            "Iftaa-Access-Card";

        link.download =
            cardID + ".png";

        link.href =
            canvas.toDataURL(
                "image/png"
            );

        link.click();

        showSuccessToast(
            t("cardImageSaved")
        );

    }
    catch(error){

        console.error(
            error
        );

        alert(
            t("imageError")
        );

    }

}

/* =====================================================
   SAVE PDF
===================================================== */

async function saveCardAsPDF(){

    const card =
        document.querySelector(
            ".generated-card"
        );

    if(!card){

        alert(
            t("createFirst")
        );

        return;

    }

    closeCardModal();

    try{

        if(
            typeof html2canvas === "undefined"
        ){

            throw new Error(
                "html2canvas is not available"
            );

        }

        const canvas =
            await html2canvas(
                card,
                {
                    scale:3,
                    useCORS:true,
                    allowTaint:false,
                    backgroundColor:"#ffffff",
                    imageTimeout:15000
                }
            );

        const imageData =
            canvas.toDataURL(
                "image/png"
            );

        if(
            !window.jspdf
        ){

            throw new Error(
                "jsPDF is not available"
            );

        }

        const {
            jsPDF
        } =
            window.jspdf;

        const cardWidth =
            90;

        const cardHeight =
            55;

        const pdf =
            new jsPDF({
                orientation:"landscape",
                unit:"mm",
                format:[
                    cardWidth,
                    cardHeight
                ]
            });

        const imageRatio =
            canvas.width /
            canvas.height;

        const pdfRatio =
            cardWidth /
            cardHeight;

        let imageWidth;
        let imageHeight;
        let x;
        let y;

        if(
            imageRatio > pdfRatio
        ){

            imageWidth =
                cardWidth;

            imageHeight =
                cardWidth /
                imageRatio;

            x = 0;

            y =
                (
                    cardHeight -
                    imageHeight
                ) / 2;

        }
        else{

            imageHeight =
                cardHeight;

            imageWidth =
                cardHeight *
                imageRatio;

            x =
                (
                    cardWidth -
                    imageWidth
                ) / 2;

            y = 0;

        }

        pdf.addImage(
            imageData,
            "PNG",
            x,
            y,
            imageWidth,
            imageHeight,
            undefined,
            "FAST"
        );

        const cardID =
            currentCardData
            ?
            currentCardData.cardID
            :
            "Iftaa-Access-Card";

        pdf.save(
            cardID + ".pdf"
        );

        showSuccessToast(
            t("cardPDFSaved")
        );

    }
    catch(error){

        console.error(
            error
        );

        alert(
            t("pdfError")
        );

    }

}
