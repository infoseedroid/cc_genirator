<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iftaa Systems Access Card</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
body{margin:0;background:#eef3f1;color:#222}
#splashScreen{position:fixed;inset:0;background:#fff;display:flex;justify-content:center;align-items:center;z-index:99999;transition:opacity .6s ease}
.splash-content{text-align:center;padding:25px}.splash-logo{width:150px;height:150px;object-fit:contain;margin-bottom:20px;animation:pulse 2s infinite}.splash-content h1{color:#0b6b4a;font-size:26px;margin:10px}.splash-content p{color:#555;font-size:16px}.spinner{width:50px;height:50px;border-radius:50%;border:5px solid #ddd;border-top-color:#0b6b4a;margin:25px auto;animation:spin 1s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.08)}}
.header{background:#0b6b4a;color:#fff;text-align:center;padding:25px}.header img{width:90px;height:90px;border-radius:50%;background:#fff;padding:5px;object-fit:contain}.header h1{margin:15px 0 5px;font-size:28px}.header p{margin:0;font-size:15px}
.container{max-width:900px;margin:auto;padding:20px}.box{background:#fff;padding:25px;border-radius:18px;box-shadow:0 5px 15px rgba(0,0,0,.15)}.section-title{text-align:center;color:#0b6b4a;font-size:22px;margin-bottom:20px}
.form-group{margin-top:18px}.form-group label{display:block;font-weight:600;margin-bottom:8px;color:#333}input,textarea,select{width:100%;padding:13px;border-radius:10px;border:1px solid #ccc;font-size:15px;outline:none}input:focus,textarea:focus,select:focus{border-color:#0b6b4a;box-shadow:0 0 5px rgba(11,107,74,.3)}textarea{height:90px;resize:none}select{background:#fff;cursor:pointer}
.create-btn,.search-btn{width:100%;padding:15px;border:none;border-radius:12px;margin-top:20px;font-size:16px;cursor:pointer}.create-btn{background:#0b6b4a;color:#fff}.search-btn{background:#555;color:#fff}.create-btn:hover{background:#095a3e}.search-btn:hover{background:#444}
.generated-card-area{display:none;margin-top:35px;padding-top:30px;border-top:2px solid #e5ebe8}.generated-card-area.show{display:block}
/* Compact landscape access card */
.generated-card{width:100%;max-width:760px;aspect-ratio:1.64/1;margin:0 auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 5px 18px rgba(0,0,0,.15);border:1px solid #e1e8e5;text-align:left;overflow:hidden;position:relative}
.card-logo{width:100%;height:20%;min-height:62px;max-height:100px;display:flex;justify-content:center;align-items:center;margin-bottom:5px;overflow:hidden}.card-logo img{width:100%;height:100%;object-fit:contain;display:block}
.generated-card h2{color:#0b6b4a;margin:3px 0 8px;font-size:18px;text-align:center}
.card-main-grid{display:grid;grid-template-columns:1fr 110px;gap:8px 12px;align-items:start}.card-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.qr-area{display:flex;justify-content:center;align-items:center;min-height:100px}#qrCode{display:flex;justify-content:center;align-items:center}.qr-placeholder{font-size:10px;color:#777;text-align:center;padding:10px}
.info-row{text-align:left;background:#f6f8f7;border-radius:8px;padding:6px 9px;line-height:1.3;word-break:break-word;font-size:11px;min-height:43px}.info-row b{color:#0b6b4a;font-size:10px}.info-row.full-width{grid-column:1/-1}
.access-notice{margin-top:8px;padding:6px 9px;background:#f0f7f4;border:1px solid #cfe3da;border-radius:8px;font-size:9px;line-height:1.4;color:#486057}.access-notice strong{color:#0b6b4a}.card-footer{margin-top:7px;padding-top:6px;border-top:1px solid #ddd;color:#666;font-size:9px;text-align:right}
.card-actions{width:100%;max-width:760px;margin:14px auto 0;text-align:center}.more-btn{border:none;background:#555;color:#fff;padding:10px 22px;border-radius:10px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.more-btn:hover{background:#444}.more-dots{font-size:22px;font-weight:bold;line-height:15px}
.card-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999999;align-items:center;justify-content:center;padding:20px}.card-modal.show{display:flex}.card-modal-box{width:100%;max-width:390px;background:#fff;border-radius:20px;padding:25px;box-shadow:0 15px 45px rgba(0,0,0,.3);animation:modalAppear .25s ease}@keyframes modalAppear{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}.card-modal-header{text-align:center;margin-bottom:20px}.card-modal-header h3{margin:0;color:#0b6b4a;font-size:21px}.card-modal-header p{margin:7px 0 0;color:#777;font-size:13px}.card-modal-option{width:100%;border:none;background:#f6f8f7;border-radius:12px;padding:14px;margin-top:10px;display:flex;align-items:center;gap:14px;font-size:15px;text-align:left;cursor:pointer;transition:.2s}.card-modal-option:hover{background:#eaf1ee;transform:translateY(-1px)}.card-modal-icon{width:44px;height:44px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.08);flex-shrink:0}.card-modal-text{flex:1}.card-modal-text strong{display:block;color:#222;font-size:15px}.card-modal-text small{display:block;color:#777;margin-top:3px;font-size:12px}.card-modal-close{width:100%;border:none;background:transparent;color:#666;padding:12px;margin-top:10px;font-size:14px;cursor:pointer}.card-modal-close:hover{color:#0b6b4a}
#successToast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(30px);background:#0b6b4a;color:#fff;padding:14px 22px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;visibility:hidden;transition:.3s;z-index:1000000;text-align:center;min-width:260px;max-width:90%}#successToast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
@media(max-width:600px){.container{padding:12px}.box{padding:18px;border-radius:15px}.header{padding:20px 15px}.header img{width:75px;height:75px}.header h1{font-size:22px}.header p{font-size:13px}.section-title{font-size:20px}.generated-card{padding:12px;border-radius:14px}.generated-card h2{font-size:15px;margin:2px 0 6px}.card-logo{height:20%;min-height:50px}.card-main-grid{grid-template-columns:1fr 72px;gap:6px}.card-info-grid{gap:5px}.qr-area{min-height:70px}#qrCode img,#qrCode canvas{width:68px!important;height:68px!important}.info-row{font-size:9px;padding:5px 6px;min-height:35px}.info-row b{font-size:8px}.access-notice{font-size:7.5px;padding:5px 6px}.card-footer{font-size:7.5px}.card-modal{padding:15px}.card-modal-box{max-width:100%;border-radius:18px;padding:20px}#successToast{bottom:20px;font-size:13px;padding:13px 18px;min-width:240px}}
</style>
</head>
<body>
<div id="splashScreen"><div class="splash-content"><img src="logo.png" class="splash-logo"><h1>Iftaa Systems Access Card</h1><p>Loading System...</p><div class="spinner"></div></div></div>
<div class="header"><img src="logo.png"><h1>Iftaa Systems Access Card</h1><p>Systems Access Authorization &amp; Management Tool</p></div>
<div class="container"><div class="box">
<h2 class="section-title">Create System Access Card</h2>
<div class="form-group"><label>Employee Name</label><input type="text" id="employeeName" placeholder="Enter employee name"></div>
<div class="form-group"><label>System Name</label><input type="text" id="systemName" placeholder="Enter system name"></div>
<div class="form-group"><label>Access Level</label><select id="accessLevel"><option value="">Select access level</option><option value="View Only">View Only</option><option value="Standard User">Standard User</option><option value="Advanced User">Advanced User</option><option value="Administrator">Administrator</option></select></div>
<div class="form-group"><label>System Environment</label><select id="environment" onchange="changeEnvironment()"><option value="">Select system environment</option><option value="Operating System">Operating System</option><option value="Desktop">Desktop App</option><option value="Web">Web App</option></select></div>
<div class="form-group" id="urlSection" style="display:none"><label>System URL</label><input type="text" id="systemUrl" placeholder="Paste web system URL here"></div>
<div class="form-group"><label>Notes</label><textarea id="notes" placeholder="Enter notes"></textarea></div>
<button class="create-btn" onclick="generateCard()">Create Access Card</button>
<button class="search-btn" onclick="showSearch()">Search / Query</button>
<div id="generatedCardArea" class="generated-card-area"><div id="generatedCard"></div><div class="card-actions"><button type="button" class="more-btn" onclick="openCardModal()"><span class="more-dots">⋮</span><span>More</span></button></div></div>
</div></div>
<div id="cardModal" class="card-modal" onclick="handleModalBackgroundClick(event)"><div class="card-modal-box"><div class="card-modal-header"><h3>Access Card Options</h3><p>Choose an action for this access card</p></div>
<button type="button" class="card-modal-option" onclick="saveCardAsImage()"><div class="card-modal-icon">🖼️</div><div class="card-modal-text"><strong>Save as Image</strong><small>Save the access card as a PNG image</small></div></button>
<button type="button" class="card-modal-option" onclick="saveCardAsPDF()"><div class="card-modal-icon">📄</div><div class="card-modal-text"><strong>Save as PDF</strong><small>Create and save an access card PDF</small></div></button>
<button type="button" class="card-modal-close" onclick="closeCardModal()">Cancel</button>
</div></div>
<div id="successToast"></div>
<script>
let selectedEnvironment="";let toastTimer;let currentCardData=null;
window.addEventListener("load",function(){const splash=document.getElementById("splashScreen");setTimeout(function(){splash.style.opacity="0";setTimeout(function(){splash.style.display="none"},600)},5000)});
function changeEnvironment(){const selected=document.getElementById("environment");selectedEnvironment=selected.value;const urlSection=document.getElementById("urlSection");if(selectedEnvironment==="Web"){urlSection.style.display="block"}else{urlSection.style.display="none";document.getElementById("systemUrl").value=""}}
function generateCard(){
const employee=document.getElementById("employeeName").value.trim();const system=document.getElementById("systemName").value.trim();const accessLevel=document.getElementById("accessLevel").value.trim();const url=document.getElementById("systemUrl").value.trim();const notes=document.getElementById("notes").value.trim();
if(employee===""||system===""||accessLevel===""||selectedEnvironment===""){alert("Please complete required fields");return}
if(selectedEnvironment==="Web"&&url===""){alert("Please enter system URL");return}
const cardID="IFT-"+new Date().getFullYear()+"-"+Math.floor(Math.random()*90000+10000);const created=new Date().toLocaleDateString("en-US");
currentCardData={cardID,employee,system,accessLevel,environment:selectedEnvironment,url,notes,created};
const qrMarkup=selectedEnvironment==="Web"?'<div class="qr-area"><div id="qrCode"></div></div>':'<div class="qr-area"><div class="qr-placeholder">QR available for Web systems</div></div>';
document.getElementById("generatedCard").innerHTML=`
<div class="generated-card">
<div class="card-logo"><img src="card-logo.png" alt="Card Logo"></div>
<h2>System Access Authorization</h2>
<div class="card-main-grid">
<div class="card-info-grid">
<div class="info-row"><b>Card ID</b><br>${escapeHTML(cardID)}</div>
<div class="info-row"><b>Employee</b><br>${escapeHTML(employee)}</div>
<div class="info-row"><b>System</b><br>${escapeHTML(system)}</div>
<div class="info-row"><b>Environment</b><br>${escapeHTML(selectedEnvironment)}</div>
<div class="info-row full-width"><b>Access Level</b><br>${escapeHTML(accessLevel)}</div>
${selectedEnvironment==="Web"?`<div class="info-row full-width"><b>System URL</b><br>${escapeHTML(url)}</div>`:""}
${notes?`<div class="info-row full-width"><b>Notes</b><br>${escapeHTML(notes)}</div>`:""}
</div>
${qrMarkup}
</div>
<div class="access-notice"><strong>🔐 Access Notice:</strong> This card documents the user's authorized access to the system. It contains no username or password. Access credentials must be handled separately according to the organization's security policy.</div>
<div class="card-footer">Created Date: ${escapeHTML(created)}</div>
</div>`;
document.getElementById("generatedCardArea").classList.add("show");
if(selectedEnvironment==="Web"){new QRCode(document.getElementById("qrCode"),{text:url,width:100,height:100})}
setTimeout(function(){document.getElementById("generatedCardArea").scrollIntoView({behavior:"smooth",block:"start"})},100);
}
function escapeHTML(value){return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function openCardModal(){document.getElementById("cardModal").classList.add("show")}
function closeCardModal(){document.getElementById("cardModal").classList.remove("show")}
function handleModalBackgroundClick(event){if(event.target===document.getElementById("cardModal")){closeCardModal()}}
function showSuccessToast(message){const toast=document.getElementById("successToast");clearTimeout(toastTimer);toast.innerHTML="✅ "+message;toast.classList.add("show");toastTimer=setTimeout(function(){toast.classList.remove("show")},3500)}
async function saveCardAsImage(){const card=document.querySelector(".generated-card");if(!card){alert("Please create an access card first.");return}closeCardModal();try{const canvas=await html2canvas(card,{scale:3,useCORS:true,backgroundColor:"#ffffff"});const link=document.createElement("a");const cardID=currentCardData?currentCardData.cardID:"Iftaa-Access-Card";link.download=cardID+".png";link.href=canvas.toDataURL("image/png");link.click();showSuccessToast("Access card image saved successfully.")}catch(error){console.error(error);alert("Unable to save the access card as an image.")}}
async function saveCardAsPDF(){const card=document.querySelector(".generated-card");if(!card){alert("Please create an access card first.");return}closeCardModal();try{const canvas=await html2canvas(card,{scale:3,useCORS:true,backgroundColor:"#ffffff"});const imageData=canvas.toDataURL("image/png");const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:[90,55]});pdf.addImage(imageData,"PNG",0,0,90,55);const cardID=currentCardData?currentCardData.cardID:"Iftaa-Access-Card";pdf.save(cardID+".pdf");showSuccessToast("Access card PDF saved successfully.")}catch(error){console.error(error);alert("Unable to create the access card PDF.")}}
function showSearch(){alert("Search and archive module will be added in the next version")}
</script>
</body>
</html>
