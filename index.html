<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Iftaa Users Accounts Generator
</title>



<!-- QR Code Library -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>



<!-- HTML To Image -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>



<!-- PDF -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>




<style>


/* =====================================================
   GLOBAL STYLE
===================================================== */


*{

box-sizing:border-box;

font-family:

"Segoe UI",
Tahoma,
Arial,
sans-serif;

}



body{

margin:0;

background:#eef3f1;

color:#222;

}



/* =====================================================
   SPLASH SCREEN
===================================================== */


#splashScreen{


position:fixed;

top:0;

left:0;

width:100%;

height:100%;


background:#ffffff;


display:flex;

justify-content:center;

align-items:center;


z-index:99999;


transition:opacity .6s ease;


}



.splash-content{


text-align:center;

padding:25px;


}



.splash-logo{


width:150px;

height:150px;


object-fit:contain;


margin-bottom:20px;


animation:pulse 2s infinite;


}



.splash-content h1{


color:#0b6b4a;


font-size:26px;


margin:10px;


}



.splash-content p{


color:#555;


font-size:16px;


}



.spinner{


width:50px;


height:50px;


border-radius:50%;


border:5px solid #ddd;


border-top-color:#0b6b4a;


margin:25px auto;


animation:spin 1s linear infinite;


}




@keyframes spin{


from{

transform:rotate(0deg);

}

to{

transform:rotate(360deg);

}


}



@keyframes pulse{


50%{

transform:scale(1.08);

}


}



/* =====================================================
   HEADER
===================================================== */


.header{


background:#0b6b4a;


color:white;


text-align:center;


padding:25px;


}




.header img{


width:90px;


height:90px;


border-radius:50%;


background:white;


padding:5px;


object-fit:contain;


}



.header h1{


margin:15px 0 5px;


font-size:28px;


}



.header p{


margin:0;


font-size:15px;


}





/* =====================================================
   CONTAINER
===================================================== */


.container{


max-width:900px;


margin:auto;


padding:20px;


}



.box{


background:white;


padding:25px;


border-radius:18px;


box-shadow:

0 5px 15px rgba(0,0,0,.15);


}



.section-title{


text-align:center;


color:#0b6b4a;


font-size:22px;


margin-bottom:20px;


}
select{

width:100%;

padding:13px;

border-radius:10px;

border:1px solid #ccc;

font-size:15px;

background:white;

outline:none;

cursor:pointer;

}

select:focus{

border-color:#0b6b4a;

box-shadow:
0 0 5px rgba(11,107,74,.3);

}


</style>


</head>


<body>





<!-- =====================================================
     SPLASH SCREEN
===================================================== -->


<div id="splashScreen">


<div class="splash-content">


<img src="logo.png"
class="splash-logo">



<h1>

Iftaa Users Accounts Generator

</h1>



<p>

Loading System...

</p>



<div class="spinner"></div>



</div>


</div>







<!-- =====================================================
     MAIN HEADER
===================================================== -->


<div class="header">


<img src="logo.png">



<h1>

Iftaa Users Accounts Generator

</h1>



<p>

Users Credentials Management Tool

</p>



</div>







<!-- =====================================================
     MAIN CONTENT
===================================================== -->


<div class="container">


<div class="box">


<h2 class="section-title">

Create User Account Card

</h2>


<!-- =====================================================
     USER INPUT FORM
===================================================== -->


<div class="form-group">


<label>

Employee Name

</label>


<input

type="text"

id="employeeName"

placeholder="Enter employee name">


</div>







<div class="form-group">


<label>

System Name

</label>


<input

type="text"

id="systemName"

placeholder="Enter system name">


</div>







<div class="form-group">


<label>

Username

</label>


<input

type="text"

id="username"

placeholder="Enter username">


</div>







<div class="form-group">


<div class="password-wrapper">

<input
type="password"
id="password"
placeholder="Enter password">

<button
type="button"
class="password-toggle"
onclick="togglePassword()"
aria-label="Show password">

👁

</button>

</div>
</div>








<div class="form-group">


<label>

System Environment

</label>




<select id="environment" onchange="changeEnvironment()">

<option value="">
Select system environment
</option>

<option value="Operating System">
Operating System
</option>

<option value="Desktop">
Desktop App
</option>

<option value="Web">
Web App
</option>

</select>


</div>








<div class="form-group"

id="urlSection"

style="display:none;">



<label>

System URL

</label>



<input

type="text"

id="systemUrl"

placeholder="Paste web system URL here">


</div>








<div class="form-group">


<label>

Notes

</label>



<textarea

id="notes"

placeholder="Enter notes"></textarea>


</div>








<button

class="create-btn"

onclick="generateCard()">



Create Account Card



</button>







<button

class="search-btn"

onclick="showSearch()">



Search / Query



</button>







</div>

</div>









<!-- =====================================================
     ADDITIONAL CSS FOR FORM
===================================================== -->


<style>


.form-group{


margin-top:18px;


}



.form-group label{


display:block;


font-weight:600;


margin-bottom:8px;


color:#333;


}



input,
textarea{


width:100%;


padding:13px;


border-radius:10px;


border:1px solid #ccc;


font-size:15px;


outline:none;


}



input:focus,
textarea:focus{


border-color:#0b6b4a;


box-shadow:

0 0 5px rgba(11,107,74,.3);


}



textarea{


height:90px;


resize:none;


}





.radio-container{


display:flex;


gap:20px;


flex-wrap:wrap;


background:#f6f8f7;


padding:15px;


border-radius:12px;


}



.radio-container label{


font-weight:normal;


cursor:pointer;


}





.create-btn,
.search-btn{


width:100%;


padding:15px;


border:none;


border-radius:12px;


margin-top:20px;


font-size:16px;


cursor:pointer;


}



.create-btn{


background:#0b6b4a;


color:white;


}




.search-btn{


background:#555;


color:white;


}

.password-wrapper{
position:relative;
}

.password-wrapper input{
padding-right:50px;
}

.password-toggle{
position:absolute;
right:8px;
top:50%;
transform:translateY(-50%);

width:38px;
height:38px;

margin:0;
padding:0;

background:transparent;
color:#0b6b4a;

border:none;

font-size:20px;

cursor:pointer;

box-shadow:none;
}

.password-toggle:hover{
background:#f1f5f4;
}

</style>

<script>


// =====================================================
// GLOBAL VARIABLES
// =====================================================


let selectedEnvironment = "";




// =====================================================
// SPLASH CONTROL
// =====================================================


window.addEventListener("load",function(){


let splash =
document.getElementById("splashScreen");



setTimeout(function(){


splash.style.opacity="0";



setTimeout(function(){


splash.style.display="none";


},600);



},5000);



});








// =====================================================
// ENVIRONMENT SELECT
// =====================================================


function changeEnvironment(){

let selected =
document.getElementById("environment");

selectedEnvironment =
selected.value;

let urlSection =
document.getElementById("urlSection");

if(selectedEnvironment === "Web"){

urlSection.style.display = "block";

}

else{

urlSection.style.display = "none";

document.getElementById("systemUrl").value = "";

}

}









// =====================================================
// GENERATE CARD
// =====================================================


function generateCard(){



let employee =
document.getElementById("employeeName").value.trim();



let system =
document.getElementById("systemName").value.trim();



let username =
document.getElementById("username").value.trim();



let password =
document.getElementById("password").value.trim();



let url =
document.getElementById("systemUrl").value.trim();



let notes =
document.getElementById("notes").value.trim();







if(
employee==="" ||
system==="" ||
username==="" ||
password==="" ||
selectedEnvironment===""

){


alert("Please complete required fields");


return;


}







if(
selectedEnvironment==="Web"
&&
url===""

){


alert("Please enter system URL");


return;


}








let cardID =

"IFT-"

+

new Date().getFullYear()

+

"-"

+

Math.floor(Math.random()*90000+10000);








let created =

new Date().toLocaleDateString("en-US");









document.querySelector(".box").innerHTML =



`



<div class="generated-card">



<div class="card-logo">

<img src="logo.png">

</div>






<h2>

User Account Credentials

</h2>






<div class="qr-area">


<div id="qrCode"></div>


</div>








<div class="info-row">

<b>

Card ID

</b>

<br>

${cardID}

</div>









<div class="info-row">

<b>

Employee

</b>

<br>

${employee}

</div>








<div class="info-row">

<b>

System

</b>

<br>

${system}

</div>








<div class="info-row">

<b>

Environment

</b>

<br>

${selectedEnvironment}

</div>







${

selectedEnvironment==="Web"

?

`

<div class="info-row">

<b>

System URL

</b>

<br>

${url}

</div>


`

:

""

}








<div class="info-row">

<b>

Username

</b>

<br>

${username}

</div>







<div class="info-row">

<b>

Password

</b>

<br>

${password}

</div>







${

notes

?

`

<div class="info-row">

<b>

Notes

</b>

<br>

${notes}

</div>


`

:

""

}








<div class="card-footer">


Created Date:

${created}


</div>






</div>





`;









// QR فقط للويب


if(selectedEnvironment==="Web"){



new QRCode(


document.getElementById("qrCode"),


{


text:url,


width:140,


height:140


}


);



}



}







// =====================================================
// TEMP SEARCH FUNCTION
// سيتم تطويرها لاحقا
// =====================================================


function showSearch(){


alert(

"Search module will be added in the next version"

);


}

function togglePassword(){

const password =
document.getElementById("password");

const button =
document.querySelector(".password-toggle");

if(password.type === "password"){

password.type = "text";

button.innerHTML = "🙈";

button.setAttribute(
"aria-label",
"Hide password"
);

}
else{

password.type = "password";

button.innerHTML = "👁";

button.setAttribute(
"aria-label",
"Show password"
);

}

}

</script>





</body>


</html>
