<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iftaa Systems Access Card</title>


<!-- QR Code Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- HTML To Image -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<style>

/* =====================================================
   GLOBAL STYLE
===================================================== */

*{
    box-sizing:border-box;
    font-family:
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;
}

body{
    margin:0;
    background:#eef3f1;
    color:#222;
}


/* =====================================================
   SPLASH SCREEN
===================================================== */

#splashScreen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#ffffff;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:99999;
    transition:opacity .6s ease;
}

.splash-content{
    text-align:center;
    padding:25px;
}

.splash-logo{
    width:150px;
    height:150px;
    object-fit:contain;
    margin-bottom:20px;
    animation:pulse 2s infinite;
}

.splash-content h1{
    color:#0b6b4a;
    font-size:26px;
    margin:10px;
}

.splash-content p{
    color:#555;
    font-size:16px;
}

.spinner{
    width:50px;
    height:50px;
    border-radius:50%;
    border:5px solid #ddd;
    border-top-color:#0b6b4a;
    margin:25px auto;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes pulse{
    50%{
        transform:scale(1.08);
    }
}


/* =====================================================
   HEADER
===================================================== */

.header{
    background:#0b6b4a;
    color:white;
    text-align:center;
    padding:25px;
}

.header img{
    width:90px;
    height:90px;
    border-radius:50%;
    background:white;
    padding:5px;
    object-fit:contain;
}

.header h1{
    margin:15px 0 5px;
    font-size:28px;
}

.header p{
    margin:0;
    font-size:15px;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.box{
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:
    0 5px 15px rgba(0,0,0,.15);
}

.section-title{
    text-align:center;
    color:#0b6b4a;
    font-size:22px;
    margin-bottom:20px;
}


/* =====================================================
   FORM
===================================================== */

.form-group{
    margin-top:18px;
}

.form-group label{
    display:block;
    font-weight:600;
    margin-bottom:8px;
    color:#333;
}

input,
textarea{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:15px;
    outline:none;
}

input:focus,
textarea:focus{
    border-color:#0b6b4a;
    box-shadow:
    0 0 5px rgba(11,107,74,.3);
}

textarea{
    height:90px;
    resize:none;
}

select{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:15px;
    background:white;
    outline:none;
    cursor:pointer;
}

select:focus{
    border-color:#0b6b4a;
    box-shadow:
    0 0 5px rgba(11,107,74,.3);
}


/* =====================================================
   BUTTONS
===================================================== */

.create-btn,
.search-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    margin-top:20px;
    font-size:16px;
    cursor:pointer;
}

.create-btn{
    background:#0b6b4a;
    color:white;
}

.search-btn{
    background:#555;
    color:white;
}

.create-btn:hover{
    background:#095a3e;
}

.search-btn:hover{
    background:#444;
}


/* =====================================================
   GENERATED CARD AREA
===================================================== */

.generated-card-area{
    display:none;
    margin-top:35px;
    padding-top:30px;
    border-top:2px solid #e5ebe8;
}

.generated-card-area.show{
    display:block;
}


/* =====================================================
   GENERATED ACCESS CARD
===================================================== */

.generated-card{
    width:100%;
    max-width:650px;
    margin:0 auto;
    background:#ffffff;
    border-radius:16px;
    padding:20px;
    box-shadow:
    0 5px 18px rgba(0,0,0,.15);
    border:1px solid #e1e8e5;
    text-align:center;
}


/* =====================================================
   CARD LOGO
   IMPORTANT:
   Keep original aspect ratio
===================================================== */

.card-logo{
    width:100%;
    height:90px;

    display:flex;
    justify-content:center;
    align-items:center;

    margin-bottom:12px;

    overflow:hidden;
}

.card-logo img{
    width:auto;
    height:100%;

    max-width:80%;

    object-fit:contain;

    display:block;
}


/* =====================================================
   CARD TITLE
===================================================== */

.generated-card h2{
    color:#0b6b4a;
    margin:8px 0 18px;
    font-size:21px;
}


/* =====================================================
   QR
===================================================== */

.qr-area{
    display:flex;
    justify-content:center;
    align-items:center;
    margin:10px 0 18px;
}

#qrCode{
    display:flex;
    justify-content:center;
    align-items:center;
}


/* =====================================================
   INFORMATION ROWS
===================================================== */

.info-row{
    text-align:left;
    background:#f6f8f7;
    border-radius:9px;
    padding:9px 12px;
    margin-top:8px;
    line-height:1.45;
    word-break:break-word;
    font-size:13px;
}

.info-row b{
    color:#0b6b4a;
}


/* =====================================================
   ACCESS STATUS
===================================================== */

.access-status{
    margin-top:10px;
    padding:8px 12px;
    border-radius:9px;
    background:#eaf6ef;
    color:#0b6b4a;
    font-size:13px;
    font-weight:700;
    text-align:center;
}


/* =====================================================
   SECURITY NOTICE
===================================================== */

.security-notice{
    margin-top:12px;
    padding:11px;
    background:#fff8e6;
    border:1px solid #ead9a6;
    border-radius:10px;
    text-align:left;
}

.security-notice-title{
    font-weight:700;
    color:#8a6500;
    font-size:13px;
    margin-bottom:6px;
}

.security-notice p{
    margin:0;
    color:#6b5500;
    font-size:11px;
    line-height:1.5;
}


/* =====================================================
   CARD FOOTER
===================================================== */

.card-footer{
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid #ddd;
    color:#666;
    font-size:11px;
}


/* =====================================================
   MORE BUTTON
===================================================== */

.card-actions{
    position:relative;
    width:100%;
    max-width:650px;
    margin:15px auto 0;
    text-align:center;
}

.more-btn{
    border:none;
    background:#555;
    color:white;
    padding:10px 22px;
    border-radius:10px;
    font-size:15px;
    cursor:pointer;

    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    transition:.2s ease;
}

.more-btn:hover{
    background:#444;
}

.more-btn:active{
    transform:scale(.97);
}

.more-dots{
    font-size:22px;
    font-weight:bold;
    line-height:15px;
}


/* =====================================================
   MODAL
===================================================== */

.card-modal{
    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.55);

    z-index:999999;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.card-modal.show{
    display:flex;
}

.card-modal-box{
    width:100%;
    max-width:390px;

    background:white;

    border-radius:20px;

    padding:25px;

    box-shadow:
    0 15px 45px rgba(0,0,0,.30);

    animation:modalAppear .25s ease;
}

@keyframes modalAppear{

    from{
        opacity:0;
        transform:scale(.90);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

.card-modal-header{
    text-align:center;
    margin-bottom:20px;
}

.card-modal-header h3{
    margin:0;
    color:#0b6b4a;
    font-size:21px;
}

.card-modal-header p{
    margin:7px 0 0;
    color:#777;
    font-size:13px;
}

.card-modal-option{
    width:100%;

    border:none;

    background:#f6f8f7;

    border-radius:12px;

    padding:14px;

    margin-top:10px;

    display:flex;

    align-items:center;

    gap:14px;

    font-size:15px;

    text-align:left;

    cursor:pointer;

    transition:
    background .2s ease,
    transform .15s ease;
}

.card-modal-option:hover{
    background:#eaf1ee;
    transform:translateY(-1px);
}

.card-modal-option:active{
    transform:scale(.98);
}

.card-modal-icon{
    width:44px;
    height:44px;

    border-radius:11px;

    background:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:22px;

    box-shadow:
    0 2px 6px rgba(0,0,0,.08);

    flex-shrink:0;
}

.card-modal-text{
    flex:1;
}

.card-modal-text strong{
    display:block;
    color:#222;
    font-size:15px;
}

.card-modal-text small{
    display:block;
    color:#777;
    margin-top:3px;
    font-size:12px;
}

.card-modal-close{
    width:100%;

    border:none;

    background:transparent;

    color:#666;

    padding:12px;

    margin-top:10px;

    font-size:14px;

    cursor:pointer;
}

.card-modal-close:hover{
    color:#0b6b4a;
}


/* =====================================================
   SUCCESS TOAST
===================================================== */

#successToast{
    position:fixed;

    left:50%;

    bottom:30px;

    transform:
    translateX(-50%)
    translateY(30px);

    background:#0b6b4a;

    color:white;

    padding:14px 22px;

    border-radius:12px;

    font-size:14px;

    font-weight:500;

    box-shadow:
    0 6px 20px rgba(0,0,0,.25);

    opacity:0;

    visibility:hidden;

    transition:
    opacity .3s ease,
    transform .3s ease,
    visibility .3s ease;

    z-index:1000000;

    text-align:center;

    min-width:260px;

    max-width:90%;
}

#successToast.show{
    opacity:1;
    visibility:visible;

    transform:
    translateX(-50%)
    translateY(0);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .box{
        padding:18px;
        border-radius:15px;
    }

    .header{
        padding:20px 15px;
    }

    .header img{
        width:75px;
        height:75px;
    }

    .header h1{
        font-size:22px;
    }

    .header p{
        font-size:13px;
    }

    .section-title{
        font-size:20px;
    }

    .generated-card{
        padding:15px;
        border-radius:14px;
    }

    .card-logo{
        height:80px;
    }

    .generated-card h2{
        font-size:19px;
        margin-bottom:14px;
    }

    .info-row{
        font-size:12px;
        padding:8px 10px;
    }

    .security-notice{
        padding:9px;
    }

    .security-notice-title{
        font-size:12px;
    }

    .security-notice p{
        font-size:10px;
    }

    .card-footer{
        font-size:10px;
    }

    .card-modal{
        padding:15px;
    }

    .card-modal-box{
        max-width:100%;
        border-radius:18px;
        padding:20px;
    }

    .card-modal-option{
        padding:14px;
    }

    #successToast{
        bottom:20px;
        font-size:13px;
        padding:13px 18px;
        min-width:240px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     SPLASH SCREEN
===================================================== -->

<div id="splashScreen">

    <div class="splash-content">

        <img
            src="logo.png"
            class="splash-logo"
        >

        <h1>
            Iftaa Systems Access Card
        </h1>

        <p>
            Loading System...
        </p>

        <div class="spinner"></div>

    </div>

</div>


<!-- =====================================================
     MAIN HEADER
===================================================== -->

<div class="header">

    <img src="logo.png">

    <h1>
        Iftaa Systems Access Card
    </h1>

    <p>
        Systems Access Authorization Management Tool
    </p>

</div>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<div class="container">

<div class="box">


<h2 class="section-title">
Create Access Card
</h2>


<!-- EMPLOYEE -->

<div class="form-group">

<label>
Employee Name
</label>

<input
    type="text"
    id="employeeName"
    placeholder="Enter employee name"
>

</div>


<!-- SYSTEM -->

<div class="form-group">

<label>
System Name
</label>

<input
    type="text"
    id="systemName"
    placeholder="Enter system name"
>

</div>


<!-- ENVIRONMENT -->

<div class="form-group">

<label>
System Environment
</label>

<select
    id="environment"
    onchange="changeEnvironment()"
>

<option value="">
Select system environment
</option>

<option value="Operating System">
Operating System
</option>

<option value="Desktop">
Desktop App
</option>

<option value="Web">
Web App
</option>

</select>

</div>


<!-- ACCESS LEVEL -->

<div class="form-group">

<label>
Access Level
</label>

<select id="accessLevel">

<option value="">
Select access level
</option>

<option value="View Only">
View Only
</option>

<option value="Standard User">
Standard User
</option>

<option value="Advanced User">
Advanced User
</option>

<option value="Administrator">
Administrator
</option>

</select>

</div>


<!-- URL -->

<div
    class="form-group"
    id="urlSection"
    style="display:none;"
>

<label>
System URL
</label>

<input
    type="text"
    id="systemUrl"
    placeholder="Paste web system URL here"
>

</div>


<!-- NOTES -->

<div class="form-group">

<label>
Notes
</label>

<textarea
    id="notes"
    placeholder="Enter notes"
></textarea>

</div>


<!-- CREATE -->

<button
    class="create-btn"
    onclick="generateCard()"
>

Create Access Card

</button>


<!-- SEARCH -->

<button
    class="search-btn"
    onclick="showSearch()"
>

Search / Query

</button>


<!-- =====================================================
     GENERATED CARD
===================================================== -->

<div
    id="generatedCardArea"
    class="generated-card-area"
>

    <div id="generatedCard"></div>


    <div class="card-actions">

        <button
            type="button"
            class="more-btn"
            onclick="openCardModal()"
        >

            <span class="more-dots">
                ⋮
            </span>

            <span>
                More
            </span>

        </button>

    </div>

</div>


</div>

</div>


<!-- =====================================================
     CARD OPTIONS MODAL
===================================================== -->

<div
    id="cardModal"
    class="card-modal"
    onclick="handleModalBackgroundClick(event)"
>

<div class="card-modal-box">


<div class="card-modal-header">

<h3>
Card Options
</h3>

<p>
Choose an action for this access card
</p>

</div>


<!-- SAVE IMAGE -->

<button
    type="button"
    class="card-modal-option"
    onclick="saveCardAsImage()"
>

<div class="card-modal-icon">
🖼️
</div>

<div class="card-modal-text">

<strong>
Save as Image
</strong>

<small>
Save the access card as a PNG image
</small>

</div>

</button>


<!-- SAVE PDF -->

<button
    type="button"
    class="card-modal-option"
    onclick="saveCardAsPDF()"
>

<div class="card-modal-icon">
📄
</div>

<div class="card-modal-text">

<strong>
Save as PDF
</strong>

<small>
Create and save a PDF access card
</small>

</div>

</button>


<!-- CLOSE -->

<button
    type="button"
    class="card-modal-close"
    onclick="closeCardModal()"
>

Cancel

</button>

</div>

</div>


<!-- =====================================================
     SUCCESS TOAST
===================================================== -->

<div id="successToast"></div>


<script>


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let selectedEnvironment = "";

let toastTimer;

let currentCardData = null;


/* =====================================================
   SPLASH
===================================================== */

window.addEventListener("load", function(){

    let splash =
        document.getElementById("splashScreen");


    setTimeout(function(){

        splash.style.opacity="0";


        setTimeout(function(){

            splash.style.display="none";

        },600);

    },5000);

});


/* =====================================================
   ENVIRONMENT
===================================================== */

function changeEnvironment(){

    let selected =
        document.getElementById("environment");


    selectedEnvironment =
        selected.value;


    let urlSection =
        document.getElementById("urlSection");


    if(selectedEnvironment === "Web"){

        urlSection.style.display="block";

    }

    else{

        urlSection.style.display="none";

        document.getElementById("systemUrl").value="";

    }

}


/* =====================================================
   GENERATE ACCESS CARD
===================================================== */

function generateCard(){


    let employee =
        document
        .getElementById("employeeName")
        .value
        .trim();


    let system =
        document
        .getElementById("systemName")
        .value
        .trim();


    let environment =
        document
        .getElementById("environment")
        .value;


    let accessLevel =
        document
        .getElementById("accessLevel")
        .value;


    let url =
        document
        .getElementById("systemUrl")
        .value
        .trim();


    let notes =
        document
        .getElementById("notes")
        .value
        .trim();


    /* REQUIRED */

    if(

        employee === "" ||

        system === "" ||

        environment === "" ||

        accessLevel === ""

    ){

        alert(
            "Please complete all required fields."
        );

        return;

    }


    /* WEB URL */

    if(

        environment === "Web" &&

        url === ""

    ){

        alert(
            "Please enter system URL."
        );

        return;

    }


    /* CARD ID */

    let cardID =

        "IFT-" +

        new Date().getFullYear() +

        "-" +

        Math.floor(
            Math.random()*90000+10000
        );


    /* DATE */

    let created =

        new Date()
        .toLocaleDateString("en-US");


    /* STORE DATA */

    currentCardData = {

        cardID:cardID,

        employee:employee,

        system:system,

        environment:environment,

        accessLevel:accessLevel,

        url:url,

        notes:notes,

        created:created

    };


    /* CREATE CARD */

    document
    .getElementById("generatedCard")
    .innerHTML =


    `

    <div class="generated-card">


        <!-- CARD LOGO -->

        <div class="card-logo">

            <img
                src="card-logo.png"
                alt="Card Logo"
            >

        </div>


        <!-- TITLE -->

        <h2>

            System Access Authorization

        </h2>


        <!-- QR -->

        ${
            environment === "Web"

            ?

            `

            <div class="qr-area">

                <div id="qrCode"></div>

            </div>

            `

            :

            ""

        }


        <!-- CARD ID -->

        <div class="info-row">

            <b>
                Access Card ID
            </b>

            <br>

            ${escapeHTML(cardID)}

        </div>


        <!-- EMPLOYEE -->

        <div class="info-row">

            <b>
                Employee
            </b>

            <br>

            ${escapeHTML(employee)}

        </div>


        <!-- SYSTEM -->

        <div class="info-row">

            <b>
                System
            </b>

            <br>

            ${escapeHTML(system)}

        </div>


        <!-- ENVIRONMENT -->

        <div class="info-row">

            <b>
                Environment
            </b>

            <br>

            ${escapeHTML(environment)}

        </div>


        <!-- ACCESS LEVEL -->

        <div class="info-row">

            <b>
                Access Level
            </b>

            <br>

            ${escapeHTML(accessLevel)}

        </div>


        <!-- URL -->

        ${
            environment === "Web"

            ?

            `

            <div class="info-row">

                <b>
                    System URL
                </b>

                <br>

                ${escapeHTML(url)}

            </div>

            `

            :

            ""

        }


        <!-- NOTES -->

        ${
            notes

            ?

            `

            <div class="info-row">

                <b>
                    Notes
                </b>

                <br>

                ${escapeHTML(notes)}

            </div>

            `

            :

            ""

        }


        <!-- STATUS -->

        <div class="access-status">

            ✓ Authorized Access

        </div>


        <!-- SECURITY NOTICE -->

        <div class="security-notice">

            <div class="security-notice-title">

                🔐 Security Notice

            </div>

            <p>

                هذه البطاقة توثق صلاحية الوصول إلى النظام فقط،
                ولا تحتوي على اسم مستخدم أو كلمة مرور أو أي
                بيانات اعتماد سرية.

            </p>

        </div>


        <!-- FOOTER -->

        <div class="card-footer">

            Created Date:

            ${escapeHTML(created)}

        </div>


    </div>

    `;


    /* QR */

    if(environment === "Web"){

        new QRCode(

            document.getElementById("qrCode"),

            {

                text:url,

                width:110,

                height:110

            }

        );

    }


    /* SHOW */

    document
    .getElementById("generatedCardArea")
    .classList.add("show");


    /* SCROLL */

    setTimeout(function(){

        document
        .getElementById("generatedCardArea")
        .scrollIntoView({

            behavior:"smooth",

            block:"start"

        });

    },100);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =====================================================
   MODAL
===================================================== */

function openCardModal(){

    document
    .getElementById("cardModal")
    .classList.add("show");

}


function closeCardModal(){

    document
    .getElementById("cardModal")
    .classList.remove("show");

}


function handleModalBackgroundClick(event){

    if(

        event.target ===
        document.getElementById("cardModal")

    ){

        closeCardModal();

    }

}


/* =====================================================
   SUCCESS TOAST
===================================================== */

function showSuccessToast(message){

    let toast =
        document.getElementById("successToast");


    clearTimeout(toastTimer);


    toast.innerHTML =
        "✅ " + message;


    toast.classList.add("show");


    toastTimer =

        setTimeout(function(){

            toast.classList.remove("show");

        },3500);

}


/* =====================================================
   SAVE CARD AS IMAGE
===================================================== */

async function saveCardAsImage(){


    let card =
        document.querySelector(".generated-card");


    if(!card){

        alert(
            "Please create an access card first."
        );

        return;

    }


    closeCardModal();


    try{


        let canvas =

            await html2canvas(

                card,

                {

                    scale:3,

                    useCORS:true,

                    allowTaint:false,

                    backgroundColor:"#ffffff",

                    imageTimeout:15000

                }

            );


        let link =
            document.createElement("a");


        let cardID =

            currentCardData

            ?

            currentCardData.cardID

            :

            "Iftaa-Access-Card";


        link.download =
            cardID + ".png";


        link.href =
            canvas.toDataURL(
                "image/png"
            );


        link.click();


        showSuccessToast(
            "Access card image saved successfully."
        );


    }

    catch(error){

        console.error(error);


        alert(
            "Unable to save the access card as an image."
        );

    }

}


/* =====================================================
   SAVE CARD AS PDF
===================================================== */

async function saveCardAsPDF(){


    let card =
        document.querySelector(".generated-card");


    if(!card){

        alert(
            "Please create an access card first."
        );

        return;

    }


    closeCardModal();


    try{


        let canvas =

            await html2canvas(

                card,

                {

                    scale:3,

                    useCORS:true,

                    allowTaint:false,

                    backgroundColor:"#ffffff",

                    imageTimeout:15000

                }

            );


        let imageData =
            canvas.toDataURL(
                "image/png"
            );


        const { jsPDF } =
            window.jspdf;


        /*
           Access Card size:
           90 × 55 mm
        */

        let cardWidth = 90;

        let cardHeight = 55;


        let pdf =

            new jsPDF({

                orientation:"landscape",

                unit:"mm",

                format:[
                    cardWidth,
                    cardHeight
                ]

            });


        /*
           Preserve exact image aspect ratio
        */

        let imageRatio =
            canvas.width /
            canvas.height;


        let pdfRatio =
            cardWidth /
            cardHeight;


        let imageWidth;
        let imageHeight;
        let x;
        let y;


        if(imageRatio > pdfRatio){

            imageWidth =
                cardWidth;

            imageHeight =
                cardWidth /
                imageRatio;

            x = 0;

            y =
                (cardHeight-imageHeight)/2;

        }

        else{

            imageHeight =
                cardHeight;

            imageWidth =
                cardHeight *
                imageRatio;

            x =
                (cardWidth-imageWidth)/2;

            y = 0;

        }


        pdf.addImage(

            imageData,

            "PNG",

            x,

            y,

            imageWidth,

            imageHeight,

            undefined,

            "FAST"

        );


        let cardID =

            currentCardData

            ?

            currentCardData.cardID

            :

            "Iftaa-Access-Card";


        pdf.save(

            cardID + ".pdf"

        );


        showSuccessToast(
            "Access card PDF saved successfully."
        );


    }

    catch(error){

        console.error(error);


        alert(
            "Unable to create the access card PDF."
        );

    }

}
