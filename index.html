<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iftaa Users Accounts Generator</title>


<!-- QR Code Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- HTML To Image -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<style>

/* =====================================================
   GLOBAL STYLE
===================================================== */

*{

box-sizing:border-box;

font-family:
"Segoe UI",
Tahoma,
Arial,
sans-serif;

}


body{

margin:0;

background:#eef3f1;

color:#222;

}


/* =====================================================
   SPLASH SCREEN
===================================================== */

#splashScreen{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:#ffffff;

display:flex;

justify-content:center;

align-items:center;

z-index:99999;

transition:opacity .6s ease;

}


.splash-content{

text-align:center;

padding:25px;

}


.splash-logo{

width:150px;

height:150px;

object-fit:contain;

margin-bottom:20px;

animation:pulse 2s infinite;

}


.splash-content h1{

color:#0b6b4a;

font-size:26px;

margin:10px;

}


.splash-content p{

color:#555;

font-size:16px;

}


.spinner{

width:50px;

height:50px;

border-radius:50%;

border:5px solid #ddd;

border-top-color:#0b6b4a;

margin:25px auto;

animation:spin 1s linear infinite;

}


@keyframes spin{

from{

transform:rotate(0deg);

}

to{

transform:rotate(360deg);

}

}


@keyframes pulse{

50%{

transform:scale(1.08);

}

}


/* =====================================================
   HEADER
===================================================== */

.header{

background:#0b6b4a;

color:white;

text-align:center;

padding:25px;

}


.header img{

width:90px;

height:90px;

border-radius:50%;

background:white;

padding:5px;

object-fit:contain;

}


.header h1{

margin:15px 0 5px;

font-size:28px;

}


.header p{

margin:0;

font-size:15px;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

max-width:900px;

margin:auto;

padding:20px;

}


.box{

background:white;

padding:25px;

border-radius:18px;

box-shadow:

0 5px 15px rgba(0,0,0,.15);

}


.section-title{

text-align:center;

color:#0b6b4a;

font-size:22px;

margin-bottom:20px;

}


/* =====================================================
   FORM
===================================================== */

.form-group{

margin-top:18px;

}


.form-group label{

display:block;

font-weight:600;

margin-bottom:8px;

color:#333;

}


input,
textarea{

width:100%;

padding:13px;

border-radius:10px;

border:1px solid #ccc;

font-size:15px;

outline:none;

}


input:focus,
textarea:focus{

border-color:#0b6b4a;

box-shadow:

0 0 5px rgba(11,107,74,.3);

}


textarea{

height:90px;

resize:none;

}


select{

width:100%;

padding:13px;

border-radius:10px;

border:1px solid #ccc;

font-size:15px;

background:white;

outline:none;

cursor:pointer;

}


select:focus{

border-color:#0b6b4a;

box-shadow:

0 0 5px rgba(11,107,74,.3);

}


/* =====================================================
   PASSWORD
===================================================== */

.password-wrapper{

position:relative;

}


.password-wrapper input{

padding-right:50px;

}


.password-toggle{

position:absolute;

right:8px;

top:50%;

transform:translateY(-50%);

width:38px;

height:38px;

margin:0;

padding:0;

background:transparent;

color:#0b6b4a;

border:none;

font-size:20px;

cursor:pointer;

box-shadow:none;

}


.password-toggle:hover{

background:#f1f5f4;

}


/* =====================================================
   BUTTONS
===================================================== */

.create-btn,
.search-btn{

width:100%;

padding:15px;

border:none;

border-radius:12px;

margin-top:20px;

font-size:16px;

cursor:pointer;

}


.create-btn{

background:#0b6b4a;

color:white;

}


.search-btn{

background:#555;

color:white;

}


.create-btn:hover{

background:#095a3e;

}


.search-btn:hover{

background:#444;

}


/* =====================================================
   GENERATED CARD AREA
===================================================== */

.generated-card-area{

display:none;

margin-top:35px;

padding-top:30px;

border-top:2px solid #e5ebe8;

}


.generated-card-area.show{

display:block;

}


/* =====================================================
   GENERATED CARD
===================================================== */

.generated-card{

width:100%;

max-width:650px;

margin:0 auto;

background:#ffffff;

border-radius:18px;

padding:25px;

box-shadow:

0 5px 18px rgba(0,0,0,.15);

border:1px solid #e1e8e5;

text-align:center;

}


/* =====================================================
   CARD LOGO
===================================================== */

.card-logo{

width:100%;

height:130px;

display:flex;

justify-content:center;

align-items:center;

margin-bottom:20px;

overflow:hidden;

}


.card-logo img{

width:100%;

height:100%;

object-fit:contain;

display:block;

}


/* =====================================================
   CARD TITLE
===================================================== */

.generated-card h2{

color:#0b6b4a;

margin:10px 0 25px;

font-size:22px;

}


/* =====================================================
   QR
===================================================== */

.qr-area{

display:flex;

justify-content:center;

align-items:center;

margin:15px 0 25px;

}


#qrCode{

display:flex;

justify-content:center;

align-items:center;

}


/* =====================================================
   INFORMATION ROWS
===================================================== */

.info-row{

text-align:left;

background:#f6f8f7;

border-radius:10px;

padding:12px 15px;

margin-top:10px;

line-height:1.6;

word-break:break-word;

}


.info-row b{

color:#0b6b4a;

}


/* =====================================================
   SECURITY NOTICE
===================================================== */

.security-notice{

margin-top:18px;

padding:15px;

background:#fff8e6;

border:1px solid #ead9a6;

border-radius:12px;

text-align:left;

}


.security-notice-title{

font-weight:700;

color:#8a6500;

font-size:15px;

margin-bottom:10px;

}


.security-notice ul{

margin:0;

padding-left:20px;

color:#555;

font-size:12px;

line-height:1.8;

}


.security-warning{

margin-top:12px;

padding-top:10px;

border-top:1px solid #ead9a6;

font-size:12px;

line-height:1.6;

color:#6b5500;

font-weight:600;

}


/* =====================================================
   CARD FOOTER
===================================================== */

.card-footer{

margin-top:20px;

padding-top:15px;

border-top:1px solid #ddd;

color:#666;

font-size:13px;

}


/* =====================================================
   MORE BUTTON
===================================================== */

.card-actions{

position:relative;

width:100%;

max-width:650px;

margin:15px auto 0;

text-align:center;

}


.more-btn{

border:none;

background:#555;

color:white;

padding:10px 22px;

border-radius:10px;

font-size:15px;

cursor:pointer;

display:inline-flex;

align-items:center;

justify-content:center;

gap:8px;

transition:.2s ease;

}


.more-btn:hover{

background:#444;

}


.more-btn:active{

transform:scale(.97);

}


.more-dots{

font-size:22px;

font-weight:bold;

line-height:15px;

}


/* =====================================================
   MODAL
===================================================== */

.card-modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.55);

z-index:999999;

align-items:center;

justify-content:center;

padding:20px;

}


.card-modal.show{

display:flex;

}


.card-modal-box{

width:100%;

max-width:390px;

background:white;

border-radius:20px;

padding:25px;

box-shadow:

0 15px 45px rgba(0,0,0,.30);

animation:modalAppear .25s ease;

}


@keyframes modalAppear{

from{

opacity:0;

transform:scale(.90);

}

to{

opacity:1;

transform:scale(1);

}

}


.card-modal-header{

text-align:center;

margin-bottom:20px;

}


.card-modal-header h3{

margin:0;

color:#0b6b4a;

font-size:21px;

}


.card-modal-header p{

margin:7px 0 0;

color:#777;

font-size:13px;

}


.card-modal-option{

width:100%;

border:none;

background:#f6f8f7;

border-radius:12px;

padding:14px;

margin-top:10px;

display:flex;

align-items:center;

gap:14px;

font-size:15px;

text-align:left;

cursor:pointer;

transition:

background .2s ease,

transform .15s ease;

}


.card-modal-option:hover{

background:#eaf1ee;

transform:translateY(-1px);

}


.card-modal-option:active{

transform:scale(.98);

}


.card-modal-icon{

width:44px;

height:44px;

border-radius:11px;

background:white;

display:flex;

align-items:center;

justify-content:center;

font-size:22px;

box-shadow:

0 2px 6px rgba(0,0,0,.08);

flex-shrink:0;

}


.card-modal-text{

flex:1;

}


.card-modal-text strong{

display:block;

color:#222;

font-size:15px;

}


.card-modal-text small{

display:block;

color:#777;

margin-top:3px;

font-size:12px;

}


.card-modal-close{

width:100%;

border:none;

background:transparent;

color:#666;

padding:12px;

margin-top:10px;

font-size:14px;

cursor:pointer;

}


.card-modal-close:hover{

color:#0b6b4a;

}


/* =====================================================
   SUCCESS TOAST
===================================================== */

#successToast{

position:fixed;

left:50%;

bottom:30px;

transform:translateX(-50%) translateY(30px);

background:#0b6b4a;

color:white;

padding:14px 22px;

border-radius:12px;

font-size:14px;

font-weight:500;

box-shadow:

0 6px 20px rgba(0,0,0,.25);

opacity:0;

visibility:hidden;

transition:

opacity .3s ease,

transform .3s ease,

visibility .3s ease;

z-index:1000000;

text-align:center;

min-width:260px;

max-width:90%;

}


#successToast.show{

opacity:1;

visibility:visible;

transform:translateX(-50%) translateY(0);

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

.container{

padding:12px;

}


.box{

padding:18px;

border-radius:15px;

}


.header{

padding:20px 15px;

}


.header img{

width:75px;

height:75px;

}


.header h1{

font-size:22px;

}


.header p{

font-size:13px;

}


.section-title{

font-size:20px;

}


.generated-card{

padding:18px;

}


.generated-card h2{

font-size:20px;

}


.card-logo{

height:110px;

}


.info-row{

font-size:14px;

}


.security-notice{

padding:13px;

}


.security-notice ul{

font-size:11px;

line-height:1.7;

}


.security-warning{

font-size:11px;

}


.card-modal{

padding:15px;

}


.card-modal-box{

max-width:100%;

border-radius:18px;

padding:20px;

}


.card-modal-option{

padding:14px;

}


#successToast{

bottom:20px;

font-size:13px;

padding:13px 18px;

min-width:240px;

}

}

</style>

</head>


<body>


<!-- =====================================================
     SPLASH SCREEN
===================================================== -->

<div id="splashScreen">

<div class="splash-content">

<img
src="logo.png"
class="splash-logo"
>

<h1>
Iftaa Users Accounts Generator
</h1>

<p>
Loading System...
</p>

<div class="spinner"></div>

</div>

</div>


<!-- =====================================================
     MAIN HEADER
===================================================== -->

<div class="header">

<img src="logo.png">

<h1>
Iftaa Users Accounts Generator
</h1>

<p>
Users Credentials Management Tool
</p>

</div>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<div class="container">

<div class="box">


<h2 class="section-title">
Create User Account Card
</h2>


<!-- EMPLOYEE -->

<div class="form-group">

<label>
Employee Name
</label>

<input
type="text"
id="employeeName"
placeholder="Enter employee name"
>

</div>


<!-- SYSTEM -->

<div class="form-group">

<label>
System Name
</label>

<input
type="text"
id="systemName"
placeholder="Enter system name"
>

</div>


<!-- USERNAME -->

<div class="form-group">

<label>
Username
</label>

<input
type="text"
id="username"
placeholder="Enter username"
>

</div>


<!-- PASSWORD -->

<div class="form-group">

<label>
Password
</label>

<div class="password-wrapper">

<input
type="password"
id="password"
placeholder="Enter password"
>

<button
type="button"
class="password-toggle"
onclick="togglePassword()"
aria-label="Show password"
>

👁

</button>

</div>

</div>


<!-- ENVIRONMENT -->

<div class="form-group">

<label>
System Environment
</label>

<select
id="environment"
onchange="changeEnvironment()"
>

<option value="">
Select system environment
</option>

<option value="Operating System">
Operating System
</option>

<option value="Desktop">
Desktop App
</option>

<option value="Web">
Web App
</option>

</select>

</div>


<!-- URL -->

<div
class="form-group"
id="urlSection"
style="display:none;"
>

<label>
System URL
</label>

<input
type="text"
id="systemUrl"
placeholder="Paste web system URL here"
>

</div>


<!-- NOTES -->

<div class="form-group">

<label>
Notes
</label>

<textarea
id="notes"
placeholder="Enter notes"
></textarea>

</div>


<!-- CREATE -->

<button
class="create-btn"
onclick="generateCard()"
>

Create Account Card

</button>


<!-- SEARCH -->

<button
class="search-btn"
onclick="showSearch()"
>

Search / Query

</button>


<!-- =====================================================
     GENERATED CARD
===================================================== -->

<div
id="generatedCardArea"
class="generated-card-area"
>

<div id="generatedCard"></div>


<div class="card-actions">

<button
type="button"
class="more-btn"
onclick="openCardModal()"
>

<span class="more-dots">
⋮
</span>

<span>
More
</span>

</button>

</div>

</div>


</div>

</div>


<!-- =====================================================
     CARD OPTIONS MODAL
===================================================== -->

<div
id="cardModal"
class="card-modal"
onclick="handleModalBackgroundClick(event)"
>

<div class="card-modal-box">


<div class="card-modal-header">

<h3>
Card Options
</h3>

<p>
Choose an action for this account card
</p>

</div>


<!-- SAVE IMAGE -->

<button
type="button"
class="card-modal-option"
onclick="saveCardAsImage()"
>

<div class="card-modal-icon">
🖼️
</div>

<div class="card-modal-text">

<strong>
Save as Image
</strong>

<small>
Save the card as a PNG image
</small>

</div>

</button>


<!-- SAVE PDF -->

<button
type="button"
class="card-modal-option"
onclick="saveCardAsPDF()"
>

<div class="card-modal-icon">
📄
</div>

<div class="card-modal-text">

<strong>
Save as PDF
</strong>

<small>
Create and save a PDF file
</small>

</div>

</button>


<!-- WHATSAPP -->

<button
type="button"
class="card-modal-option"
onclick="shareCardWhatsApp()"
>

<div class="card-modal-icon">
💬
</div>

<div class="card-modal-text">

<strong>
Share via WhatsApp
</strong>

<small>
Send the credentials through WhatsApp
</small>

</div>

</button>


<!-- CLOSE -->

<button
type="button"
class="card-modal-close"
onclick="closeCardModal()"
>

Cancel

</button>

</div>

</div>


<!-- =====================================================
     SUCCESS TOAST
===================================================== -->

<div id="successToast"></div>


<script>

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let selectedEnvironment = "";

let toastTimer;

let currentCardData = null;


/* =====================================================
   SPLASH
===================================================== */

window.addEventListener("load", function(){

let splash =
document.getElementById("splashScreen");


setTimeout(function(){

splash.style.opacity="0";


setTimeout(function(){

splash.style.display="none";

},600);


},5000);

});


/* =====================================================
   ENVIRONMENT
===================================================== */

function changeEnvironment(){

let selected =
document.getElementById("environment");


selectedEnvironment =
selected.value;


let urlSection =
document.getElementById("urlSection");


if(selectedEnvironment === "Web"){

urlSection.style.display="block";

}

else{

urlSection.style.display="none";

document.getElementById("systemUrl").value="";

}

}


/* =====================================================
   GENERATE CARD
===================================================== */

function generateCard(){


let employee =
document
.getElementById("employeeName")
.value
.trim();


let system =
document
.getElementById("systemName")
.value
.trim();


let username =
document
.getElementById("username")
.value
.trim();


let password =
document
.getElementById("password")
.value
.trim();


let url =
document
.getElementById("systemUrl")
.value
.trim();


let notes =
document
.getElementById("notes")
.value
.trim();


/* REQUIRED FIELDS */

if(

employee === "" ||

system === "" ||

username === "" ||

password === "" ||

selectedEnvironment === ""

){

alert(
"Please complete required fields"
);

return;

}


/* WEB URL */

if(

selectedEnvironment === "Web" &&

url === ""

){

alert(
"Please enter system URL"
);

return;

}


/* CARD ID */

let cardID =

"IFT-" +

new Date().getFullYear() +

"-" +

Math.floor(
Math.random()*90000+10000
);


/* DATE */

let created =

new Date()
.toLocaleDateString("en-US");


/* STORE DATA */

currentCardData = {

cardID:cardID,

employee:employee,

system:system,

username:username,

password:password,

environment:selectedEnvironment,

url:url,

notes:notes,

created:created

};


/* CREATE CARD */

document
.getElementById("generatedCard")
.innerHTML =


`

<div class="generated-card">


<!-- CARD LOGO -->

<div class="card-logo">

<img src="card-logo.png">

</div>


<!-- TITLE -->

<h2>

User Account Credentials

</h2>


<!-- QR -->

<div class="qr-area">

<div id="qrCode"></div>

</div>


<!-- CARD ID -->

<div class="info-row">

<b>
Card ID
</b>

<br>

${escapeHTML(cardID)}

</div>


<!-- EMPLOYEE -->

<div class="info-row">

<b>
Employee
</b>

<br>

${escapeHTML(employee)}

</div>


<!-- SYSTEM -->

<div class="info-row">

<b>
System
</b>

<br>

${escapeHTML(system)}

</div>


<!-- ENVIRONMENT -->

<div class="info-row">

<b>
Environment
</b>

<br>

${escapeHTML(selectedEnvironment)}

</div>


<!-- WEB URL -->

${

selectedEnvironment === "Web"

?

`

<div class="info-row">

<b>
System URL
</b>

<br>

${escapeHTML(url)}

</div>

`

:

""

}


<!-- USERNAME -->

<div class="info-row">

<b>
Username
</b>

<br>

${escapeHTML(username)}

</div>


<!-- PASSWORD -->

<div class="info-row">

<b>
Password
</b>

<br>

${escapeHTML(password)}

</div>


<!-- NOTES -->

${

notes

?

`

<div class="info-row">

<b>
Notes
</b>

<br>

${escapeHTML(notes)}

</div>

`

:

""

}


<!-- =====================================================
     SECURITY NOTICE
===================================================== -->

<div class="security-notice">

<div class="security-notice-title">

🔐 تعليمات أمنية مهمة

</div>


<ul>

<li>
هذه البيانات مخصصة للمستخدم المحدد فقط.
</li>

<li>
يُمنع مشاركة اسم المستخدم أو كلمة المرور مع أي شخص آخر.
</li>

<li>
يتحمل المستخدم مسؤولية المحافظة على سرية بيانات الدخول.
</li>

<li>
لا تحفظ كلمة المرور على أجهزة عامة أو مشتركة.
</li>

<li>
في حال الاشتباه بتسرب أو استخدام غير مصرح به للحساب، يجب إبلاغ قسم الدعم الفني فورًا.
</li>

<li>
يمنع استخدام حساب مستخدم آخر أو مشاركة الحساب مع الآخرين.
</li>

</ul>


<div class="security-warning">

تنبيه: استلام هذه البطاقة يعني أن المستخدم مسؤول عن المحافظة على سرية بيانات الدخول وعدم مشاركتها أو تمكين الآخرين من استخدامها.

</div>

</div>


<!-- FOOTER -->

<div class="card-footer">

Created Date:

${escapeHTML(created)}

</div>


</div>

`;


/* SHOW CARD */

document
.getElementById("generatedCardArea")
.classList.add("show");


/* QR ONLY FOR WEB */

if(selectedEnvironment === "Web"){

new QRCode(

document.getElementById("qrCode"),

{

text:url,

width:140,

height:140

}

);

}


/* SCROLL */

setTimeout(function(){

document
.getElementById("generatedCardArea")
.scrollIntoView({

behavior:"smooth",

block:"start"

});

},100);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

/* =====================================================
   SAVE PDF
===================================================== */

async function saveCardAsPDF(){

let card =
document.querySelector(".generated-card");


if(!card){

alert(
"Please create an account card first."
);

return;

}


closeCardModal();


try{

let canvas =

await html2canvas(

card,

{

scale:2,

useCORS:true,

backgroundColor:"#ffffff"

}

);


let imageData =
canvas.toDataURL("image/png");


const { jsPDF } =
window.jspdf;


let pdf =

new jsPDF({

orientation:"portrait",

unit:"mm",

format:"a4"

});


let pageWidth =
pdf.internal.pageSize.getWidth();


let pageHeight =
pdf.internal.pageSize.getHeight();


let margin = 15;


let imageWidth =
pageWidth - (margin*2);


let imageHeight =

(canvas.height * imageWidth)
/
canvas.width;


if(

imageHeight >

pageHeight - (margin*2)

){

imageHeight =

pageHeight - (margin*2);


imageWidth =

(canvas.width * imageHeight)
/
canvas.height;

}


let x =

(pageWidth-imageWidth)/2;


let y =

margin;


pdf.addImage(

imageData,

"PNG",

x,

y,

imageWidth,

imageHeight

);


let cardID =

currentCardData

?

currentCardData.cardID

:

"Iftaa-Account-Card";


pdf.save(

cardID + ".pdf"

);


showSuccessToast(
"PDF file saved successfully."
);


}

catch(error){

console.error(error);


alert(
"Unable to create the PDF file."
);

}

}

function togglePassword(){

document.getElementById("password");


const button =

document.querySelector(
".password-toggle"
);

password.type === "password"

){

password.type="text";

button.setAttribute(

"aria-label",

"Hide password"

);

}

else{

password.type="password";

button.innerHTML="👁";

button.setAttribute(

"aria-label",

"Show password"

);

}

}
